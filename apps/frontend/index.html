<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stat'sTheGame: The game, measured ball by ball." />
    <link rel="icon" href="/brand/statsthegame-favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <title>Stat'sTheGame</title>
    <!-- The homepage hero is the mobile LCP image. Discover it before React starts,
         without fetching it on other routes that share this SPA document. -->
    <script>
      if (window.location.pathname === '/') {
        const heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.href = '/images/cricket-match-john-oswald-unsplash.jpg';
        heroPreload.fetchPriority = 'high';
        document.head.appendChild(heroPreload);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
