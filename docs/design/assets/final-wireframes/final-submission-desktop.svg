  <rect x="24" y="860" width="1232" height="134" rx="8" fill="#E7F0FB" stroke="#1F5FAD" stroke-width="1.5"/>
  <text x="40" y="882" font-size="13" font-weight="700" fill="#1F5FAD" text-anchor="start">Annotations</text>
  <text x="40" y="904" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">1. Guided packages share one durable receipt, worker processing and report (#266, #361, #435, #437).</text>
  <text x="40" y="924" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">2. Set apart so it is not mistaken for a guided upload (#500).</text>
  <text x="40" y="944" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">3. Readable, searchable selectors instead of database IDs (#703).</text>
  <text x="40" y="964" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">4. Receipt links to /submissions/batches/:batchReference: plain-language report, reference mapping.</text>
  <text x="40" y="984" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">5. Returned-for-correction batches offer a replacement upload that keeps original → replacement history (#539).</text>
