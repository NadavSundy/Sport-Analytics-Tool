<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 890" width="1280" height="890" role="img" aria-labelledby="final-account-desktop-title final-account-desktop-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="final-account-desktop-title">Final wireframe: Account area (desktop)</title>
  <desc id="final-account-desktop-desc">Implemented /account/:section page with Overview, Access, API access and Account management sections for any signed-in user.</desc>
  <rect x="0" y="0" width="1280" height="890" fill="#FFFFFF" stroke="#9AA4AD" stroke-width="2"/>
  <rect x="0" y="0" width="1280" height="64" fill="#14202B"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Stat&#x27;sTheGame</text>
  <text x="220" y="39" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Explore Data ▾</text>
  <text x="370.4" y="39" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Pinned ▾</text>
  <text x="471.59999999999997" y="39" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">Downloads</text>
  <text x="575.4" y="39" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start">API</text>
  <text x="1022" y="39" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">Manage account</text>
  <text x="844" y="39" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">Manage Submission ▾</text>
  <rect x="1176" y="18" width="72" height="28" rx="14" fill="#22313E" stroke="#4A5866" stroke-width="1.5"/>
  <text x="1212" y="37" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">Theme</text>
  <text x="48" y="100" font-size="11" font-weight="700" fill="#5E7F00" text-anchor="start">IDENTITY AND ACCESS</text>
  <text x="48" y="134" font-size="30" font-weight="700" fill="#14202B" text-anchor="start">Account</text>
  <text x="60" y="178" font-size="14" font-weight="700" fill="#14202B" text-anchor="start">Overview</text>
  <rect x="56" y="186" width="75" height="3" fill="#5E7F00"/>
  <text x="151" y="178" font-size="14" font-weight="500" fill="#5B6772" text-anchor="start">Access</text>
  <text x="225" y="178" font-size="14" font-weight="500" fill="#5B6772" text-anchor="start">API access</text>
  <text x="333" y="178" font-size="14" font-weight="500" fill="#5B6772" text-anchor="start">Account management</text>
  <line x1="48" y1="189" x2="496" y2="189" stroke="#9AA4AD"/>
  <circle cx="36" cy="176" r="11" fill="#1F5FAD"/>
  <text x="36" y="180.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="48" y="212" width="720" height="220" rx="6" fill="#FFFFFF" stroke="#9AA4AD" stroke-width="1.5"/>
  <text x="68" y="244" font-size="18" font-weight="700" fill="#14202B" text-anchor="start">Overview</text>
  <text x="68" y="276" font-size="13" font-weight="400" fill="#5B6772" text-anchor="start">Signed in as person@example.com</text>
  <text x="68" y="312" font-size="13" font-weight="700" fill="#14202B" text-anchor="start">Submission access</text>
  <rect x="240" y="296" width="180" height="26" rx="13" fill="#EEF4D9" stroke="#5E7F00" stroke-width="1.5"/>
  <text x="330" y="314" font-size="12" font-weight="600" fill="#14202B" text-anchor="middle">Approved submitter</text>
  <text x="68" y="350" font-size="13" font-weight="700" fill="#14202B" text-anchor="start">Competition scopes</text>
  <rect x="240" y="334" width="178" height="32" rx="6" fill="#FFFFFF" stroke="#9AA4AD" stroke-width="1.5"/>
  <text x="329.0" y="355" font-size="13" font-weight="600" fill="#14202B" text-anchor="middle">View approved scopes</text>
  <circle cx="56" cy="362" r="11" fill="#1F5FAD"/>
  <text x="56" y="366.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="800" y="212" width="432" height="132" rx="6" fill="#F1F0EB" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="818" y="240" font-size="14" font-weight="700" fill="#14202B" text-anchor="start">Access  (/account/access)</text>
  <text x="830" y="268" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">• Submitter access request and status</text>
  <text x="830" y="290" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">• Request additional competition</text>
  <rect x="800" y="362" width="432" height="132" rx="6" fill="#F1F0EB" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="818" y="390" font-size="14" font-weight="700" fill="#14202B" text-anchor="start">API access  (/account/api-access)</text>
  <text x="830" y="418" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">• Request consumer access</text>
  <text x="830" y="440" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">• Awaiting administrator review</text>
  <text x="830" y="462" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">• Copy your API key now (shown once)</text>
  <rect x="800" y="512" width="432" height="132" rx="6" fill="#F1F0EB" stroke="#9AA4AD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="818" y="540" font-size="14" font-weight="700" fill="#14202B" text-anchor="start">Account management  (/account/security)</text>
  <text x="830" y="568" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">• Sign out</text>
  <text x="830" y="590" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">• Danger zone: Delete account (confirmed)</text>
  <circle cx="788" cy="224" r="11" fill="#1F5FAD"/>
  <text x="788" y="228.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="48" y="480" font-size="14" font-weight="700" fill="#14202B" text-anchor="start">Signed-out visitor</text>
  <rect x="48" y="494" width="720" height="56" rx="6" fill="#F1F0EB" stroke="#9AA4AD" stroke-width="1.5"/>
  <text x="68" y="528" font-size="13" font-weight="400" fill="#5B6772" text-anchor="start">You are signed out. Login or Sign up to view your account.</text>
  <text x="48" y="590" font-size="14" font-weight="700" fill="#14202B" text-anchor="start">Sign in</text>
  <rect x="48" y="604" width="720" height="120" rx="6" fill="#FFFFFF" stroke="#9AA4AD" stroke-width="1.5"/>
  <text x="68" y="636" font-size="14" font-weight="600" fill="#14202B" text-anchor="start">Continue with Google  (Supabase Auth)</text>
  <text x="68" y="664" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start" font-family="Consolas, Menlo, monospace">/sign-in → Google → /auth/callback (&quot;Completing Sign In&quot;) → validated return path</text>
  <circle cx="56" cy="690" r="11" fill="#1F5FAD"/>
  <text x="56" y="694.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <rect x="24" y="752" width="1232" height="114" rx="8" fill="#E7F0FB" stroke="#1F5FAD" stroke-width="1.5"/>
  <text x="40" y="774" font-size="13" font-weight="700" fill="#1F5FAD" text-anchor="start">Annotations</text>
  <text x="40" y="796" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">1. Account sections; header Manage account always opens /account/overview (#713).</text>
  <text x="40" y="816" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">2. Approved competition scopes are discoverable from Overview (#714).</text>
  <text x="40" y="836" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">3. Other sections, shown here as summaries; each is its own URL under /account.</text>
  <text x="40" y="856" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">4. Protected deep links return through sign-in; external or protocol-relative targets are rejected (#581).</text>
</svg>
