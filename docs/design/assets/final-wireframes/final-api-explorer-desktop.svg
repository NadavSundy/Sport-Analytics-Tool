<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="final-api-explorer-desktop-title final-api-explorer-desktop-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="final-api-explorer-desktop-title">Final wireframe: API Explorer (desktop)</title>
  <desc id="final-api-explorer-desktop-desc">Implemented /api page: supported major version, supporting resources, how to access the API (public, identified consumer, application and admin), implementation status and the interactive OpenAPI explorer.</desc>
