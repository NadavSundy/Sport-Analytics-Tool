  <text x="48" y="158" font-size="14" font-weight="400" fill="#5B6772" text-anchor="start">Public T20 cricket data API, documented from the OpenAPI contract.</text>
  <rect x="48" y="184" width="1184" height="52" rx="8" fill="#F1F0EB" stroke="#9AA4AD" stroke-width="1.5"/>
  <text x="68" y="216" font-size="15" font-weight="700" fill="#14202B" text-anchor="start">Supported API major version: v1</text>
  <text x="760" y="216" font-size="13" font-weight="400" fill="#5B6772" text-anchor="start">API documentation   ·   Dataset downloads   ·   Access and authentication</text>
