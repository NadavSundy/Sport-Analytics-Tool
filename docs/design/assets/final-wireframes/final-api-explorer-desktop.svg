  <text x="66" y="346" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">No key. Read published records.</text>
  <rect x="448" y="292" width="376" height="96" rx="6" fill="#FFFFFF" stroke="#9AA4AD" stroke-width="1.5"/>
  <text x="466" y="322" font-size="15" font-weight="700" fill="#14202B" text-anchor="start">Identified consumer access</text>
  <text x="466" y="346" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">Request a key in Account → API access.</text>
  <rect x="848" y="292" width="376" height="96" rx="6" fill="#FFFFFF" stroke="#9AA4AD" stroke-width="1.5"/>
  <text x="866" y="322" font-size="15" font-weight="700" fill="#14202B" text-anchor="start">Application and admin API</text>
  <text x="866" y="346" font-size="12" font-weight="400" fill="#5B6772" text-anchor="start">Signed-in session; role checked by backend.</text>
