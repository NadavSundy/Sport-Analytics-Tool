<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" width="1280" height="1000" role="img" aria-labelledby="final-review-workspace-desktop-title final-review-workspace-desktop-desc" font-family="Helvetica, Arial, sans-serif">
