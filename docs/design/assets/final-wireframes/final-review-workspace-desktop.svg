  <text x="40" y="916" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">1. Batch detail at /reviews/batches/:batchReference; sections stack in one detail view.</text>
  <text x="40" y="936" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">2. Participants to onboard need a durable identifier before approval (#708, #770).</text>
  <text x="40" y="956" font-size="12" font-weight="400" fill="#14202B" text-anchor="start">3. Decisions: Approve and publish (accepted subset), Return for correction, Reject batch.</text>
