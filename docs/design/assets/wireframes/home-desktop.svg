<text x="330.0" y="304.0" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">Browse fixtures</text>
<text x="24" y="360" font-size="16" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Explosive. Exact. Traceable.</text>
<rect x="24" y="380" width="396" height="120" rx="4" fill="#FFFFFF" stroke="#9AA5AA" stroke-width="1.5"/>
<text x="40" y="410" font-size="18" font-weight="bold" font-style="normal" fill="#5D7E00" text-anchor="start">01</text>
<text x="40" y="436" font-size="13" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Event-led</text>
<text x="40" y="458" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">Published figures begin with accepted, event-level data.</text>
<rect x="444" y="380" width="396" height="120" rx="4" fill="#FFFFFF" stroke="#9AA5AA" stroke-width="1.5"/>
<text x="460" y="410" font-size="18" font-weight="bold" font-style="normal" fill="#5D7E00" text-anchor="start">02</text>
<text x="460" y="436" font-size="13" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Public by design</text>
<text x="460" y="458" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">Published cricket records are available without an account.</text>
<rect x="864" y="380" width="396" height="120" rx="4" fill="#FFFFFF" stroke="#9AA5AA" stroke-width="1.5"/>
<text x="880" y="410" font-size="18" font-weight="bold" font-style="normal" fill="#5D7E00" text-anchor="start">03</text>
<text x="880" y="436" font-size="13" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Built for evidence</text>
<text x="880" y="458" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">Every published result stays connected to its source.</text>
<text x="24" y="552" font-size="13" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">States</text>
