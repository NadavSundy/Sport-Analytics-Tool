<text x="220" y="170" font-size="11" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">Public T20 cricket record</text>
<text x="220" y="200" font-size="28" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Stat’sTheGame</text>
<text x="220" y="226" font-size="13" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">The game, measured ball by ball.</text>
<text x="220" y="250" font-size="11" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">An event-driven home for published cricket records —</text>
<text x="220" y="266" font-size="11" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">no sign-in required to browse.</text>
