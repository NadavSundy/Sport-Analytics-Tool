      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    ParticipantFixtureCollectionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantFixture'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    SubmissionFielder:
      type: object
      additionalProperties: false
      properties:
        participantId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        substitute:
          type: boolean
          default: false

    SubmissionWicket:
      type: object
      additionalProperties: false
      required:
        - kind
        - playerOutId
      properties:
        kind:
          type: string
          enum:
            - caught
            - bowled
            - lbw
            - stumped
            - caught and bowled
            - hit wicket
            - run out
            - obstructing the field
            - timed out
            - hit the ball twice
            - handled the ball
            - retired hurt
            - retired out
            - retired not out
        playerOutId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        fielders:
          type: array
          maxItems: 11
          default: []
          items:
            $ref: '#/components/schemas/SubmissionFielder'

    SubmissionEvent:
      type: object
      description: A single ordered cricket delivery event, not a statistic total.
      additionalProperties: false
      required:
        - eventId
        - inningsId
        - sequenceNumber
        - overNumber
        - positionInOver
        - ballNumber
        - strikerId
        - nonStrikerId
        - bowlerId
        - runs
      properties:
        eventId:
          type: string
          format: uuid
          description: Globally unique client-generated identifier used to detect retries.
        inningsId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        sequenceNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        overNumber:
          type: integer
          minimum: 0
          maximum: 32767
        positionInOver:
          type: integer
          minimum: 0
          maximum: 32767
          description: Zero-based position in the over; unlike the display ball number, this cannot repeat.
        ballNumber:
          type: string
          minLength: 1
          maxLength: 32
        strikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        nonStrikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        bowlerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        runs:
          type: object
          additionalProperties: false
          required:
            - offBat
            - extras
            - total
          properties:
            offBat:
              type: integer
              minimum: 0
              maximum: 32767
            extras:
              type: integer
              minimum: 0
              maximum: 32767
            total:
              type: integer
              minimum: 0
              maximum: 32767
            nonBoundary:
              type: boolean
              default: false
        extras:
          type: object
          additionalProperties: false
          default: {}
          properties:
            wides:
              type: integer
              minimum: 0
              maximum: 32767
            noBalls:
              type: integer
              minimum: 0
              maximum: 32767
            byes:
              type: integer
              minimum: 0
              maximum: 32767
            legByes:
              type: integer
              minimum: 0
              maximum: 32767
            penalty:
              type: integer
              minimum: 0
              maximum: 32767
        wickets:
          type: array
          maxItems: 2
          default: []
          items:
            $ref: '#/components/schemas/SubmissionWicket'

    SubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - fixtureId
        - schemaVersion
        - events
      properties:
        fixtureId:
          $ref: '#/components/schemas/DatabaseIdentifier'

        schemaVersion:
          type: string
          const: '1.0'

        events:
          type: array
          description: Events for each innings must appear in ascending sequenceNumber order.
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SubmissionEvent'

    Submission:
      type: object
      additionalProperties: false
      required:
        - submissionId
        - fixtureId
        - submitterId
        - status
        - receivedAt
        - schemaVersion
        - eventCount
      properties:
        submissionId:
          $ref: '#/components/schemas/ApiIdentifier'
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        submitterId:
          $ref: '#/components/schemas/ApiIdentifier'
        status:
          type: string
          const: accepted
        receivedAt:
          type: string
          format: date-time
        schemaVersion:
          type: string
          const: '1.0'
        eventCount:
          type: integer
          minimum: 1

    SubmissionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Submission'

    CorrectionEvent:
      type: object
      description: Corrected delivery content. The source event ID and occurrence sequence are inherited from the target event.
      additionalProperties: false
      required:
        - inningsId
        - overNumber
        - positionInOver
        - ballNumber
        - strikerId
        - nonStrikerId
        - bowlerId
        - runs
      properties:
        inningsId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        overNumber:
          type: integer
          minimum: 0
          maximum: 32767
        positionInOver:
          type: integer
          minimum: 0
          maximum: 32767
        ballNumber:
          type: string
          pattern: '^\\d{1,3}\\.\\d{1,2}$'
        strikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        nonStrikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        bowlerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        runs:
          type: object
          additionalProperties: false
          required: [offBat, extras, total]
          properties:
            offBat: { type: integer, minimum: 0, maximum: 32767 }
            extras: { type: integer, minimum: 0, maximum: 32767 }
            total: { type: integer, minimum: 0, maximum: 32767 }
            nonBoundary: { type: boolean, default: false }
        extras:
          type: object
          additionalProperties: false
          default: {}
          properties:
            wides: { type: integer, minimum: 0, maximum: 32767 }
            noBalls: { type: integer, minimum: 0, maximum: 32767 }
            byes: { type: integer, minimum: 0, maximum: 32767 }
            legByes: { type: integer, minimum: 0, maximum: 32767 }
            penalty: { type: integer, minimum: 0, maximum: 32767 }
        wickets:
          type: array
          maxItems: 2
          default: []
          items:
            $ref: '#/components/schemas/SubmissionWicket'

    CorrectionRequest:
      type: object
      additionalProperties: false
      required: [fixtureId, schemaVersion, event]
      properties:
        fixtureId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        schemaVersion:
          type: string
          const: '1.0'
        event:
          $ref: '#/components/schemas/CorrectionEvent'

    Correction:
      type: object
      additionalProperties: false
      required: [eventId, fixtureId, revision]
      properties:
        eventId:
          type: string
          format: uuid
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        revision:
          type: integer
          minimum: 1

    CorrectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Correction'
