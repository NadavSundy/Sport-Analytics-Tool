        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }

    BatchCounts:
      type: object
      additionalProperties: false
      required: [accepted, rejected, unresolved, duplicate, conflicting]
      properties:
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        unresolved: { type: integer, minimum: 0 }
        duplicate: { type: integer, minimum: 0 }
        conflicting: { type: integer, minimum: 0 }

    BatchStatus:
      type: object
      additionalProperties: false
      required:
        [
          batchReference,
          competitionId,
          status,
          statusUrl,
          receivedAt,
          updatedAt,
          progress,
          counts,
          source,
          lineage,
          review,
        ]
      properties:
        batchReference: { type: string, format: uuid }
        competitionId: { $ref: '#/components/schemas/DatabaseIdentifier' }
        status:
          type: string
          enum:
            [
              received,
              stored,
              validating,
              rejected,
              awaiting_review,
              correction_requested,
              publishing,
              published,
              partially_published,
              failed,
              superseded,
            ]
        statusUrl: { type: string, pattern: '^/api/v1/batches/' }
        receivedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/BatchProgress' }
        counts: { $ref: '#/components/schemas/BatchCounts' }
        source:
          type: object
          additionalProperties: false
          required: [fileName, checksum, packageVersion, submitter]
          properties:
            fileName: { type: [string, 'null'] }
            checksum: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
            packageVersion: { type: string, minLength: 1 }
            submitter:
              type: object
              additionalProperties: false
              required: [accountId, displayName]
              properties:
                accountId: { $ref: '#/components/schemas/DatabaseIdentifier' }
                displayName: { type: [string, 'null'] }
        lineage:
          type: object
          additionalProperties: false
          required: [replacesBatchReference, supersededByBatchReference]
          properties:
            replacesBatchReference: { type: [string, 'null'], format: uuid }
            supersededByBatchReference: { type: [string, 'null'], format: uuid }
        review:
          oneOf:
            - { $ref: '#/components/schemas/BatchReviewDecision' }
            - { type: 'null' }

    BatchReviewDecision:
      type: object
      additionalProperties: false
      required: [decision, actor, decidedAt, reason]
      properties:
        decision: { type: string, enum: [approved, rejected, returned_for_correction] }
        actor:
          type: object
          additionalProperties: false
          required: [accountId, displayName]
          properties:
            accountId: { $ref: '#/components/schemas/DatabaseIdentifier' }
            displayName: { type: [string, 'null'] }
        decidedAt: { type: string, format: date-time }
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Reviewer-provided audit reason.

    BatchReviewRequest:
