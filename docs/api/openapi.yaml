    FixtureCollectionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Fixture'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    PublicEventResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PublicEvent'

    PublicEventCollectionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicEvent'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    CompetitorResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Competitor'

    CompetitorCollectionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Competitor'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    ParticipantResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Participant'

    ParticipantCollectionResponse:
      type: object
      additionalProperties: false
