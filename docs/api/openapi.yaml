openapi: 3.1.0

info:
  title: Sport Analytics API
  version: 1.0.0
  description: |
    Version-controlled contract for the handwritten Sport Analytics backend API.

    Operations marked with `x-implementation-status: planned` document agreed
    contracts that are not yet implemented. Implemented operations describe
    current backend behaviour.
x-ai-declaration: >-
  The preceding OpenAPI document was planned, generated, reviewed and edited
  with the assistance of ChatGPT-Web[GPT-5.6 Sol] and Codex[GPT-5].
servers:
  - url: statsthegame-api-dev-eecff5bbfjbyhbb2.southafricanorth-01.azurewebsites.net
    description: Development API

security: []

tags:
  - name: Health
    description: Service health and availability.

  - name: Authentication and Profile
    description: Managed-authentication identity and profile-related operations.

  - name: Public Read
    description: Anonymous sport-reference, fixture, accepted-event and statistic reads.

  - name: Weather
    description: >-
      Contextual weather lookup for a location and date, backed by the
      Open-Meteo external API. See ADR-008 for the integration decision.

  - name: Submissions
    description: Approved-submitter event-submission operations.

  - name: Submitter Access
    description: Authenticated submitter-access request operations.

  - name: Administration
    description: Administrator-only application-account and submitter-scope operations.

paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check API health
      operationId: getHealth
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: API is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: sport-analytics-api
                timestamp: '2026-08-09T14:00:00.000Z'

  /api/v1/auth/me:
    get:
      tags:
        - Authentication and Profile
      summary: Return the current application user profile
      description: |
        Verifies the bearer token through Supabase Auth, creates or synchronizes
        the provider-neutral application account, and returns server-owned role,
        submitter-approval and competition-scope state.

        Authentication never grants or changes approval, role or scope.
      operationId: getCurrentUserProfile
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current synchronized application user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/account:
    delete:
      tags:
        - Authentication and Profile
      summary: Permanently delete the authenticated account
      description: |
        Requires an exact `DELETE` confirmation and a Supabase sign-in no more
        than 15 minutes old. With server-only Supabase administration configured,
        the backend immediately disables the local account, removes its
        authorisation grants, hard-deletes its Supabase Auth user, and tombstones
        local identity fields.

        Cricket submissions, fixtures, deliveries, statistics and their stable
        provenance link remain available without the former display name or
        reusable authentication subject. If the server-only key is absent, the
        operation fails before changing local state.
      operationId: deleteCurrentAccount
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '200':
          description: Account identity deleted and local session may now be cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The identity was not authenticated recently enough.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The exact deletion confirmation was not supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '501':
          description: Server-only Supabase Auth administration is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: |
            Deletion could not be completed. The local account remains disabled
            and the operation can be retried safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/submitter-access-requests:
    post:
      tags:
        - Submitter Access
      summary: Request submitter access
      description: |
        Creates a competition-scoped submitter-access request for the
        authenticated application account by validating and storing the
        requested competition while transitioning an eligible server-owned
        approval state to `pending`.

        Accounts already in `pending` or `approved` state cannot create another
        active request. A previously rejected account may request access again.
      operationId: requestSubmitterAccess
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitterAccessRequest'
      responses:
        '201':
          description: Submitter access request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterAccessRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The account already has a pending request or is already approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The request body or requested competition is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/admin/users:
    get:
      tags:
        - Administration
      summary: List registered users and competition scope choices
      description: |
        Returns every registered application account with its authoritative role,
        compatibility approval state, requested competition, current named
        competition scopes, account state and latest submitter-access audit.
        Only an `admin` may call this operation.
      operationId: listAdministratorUsers
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registered users and valid competition scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorUserManagementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{userId}/submitter-access:
    patch:
      tags:
        - Administration
      summary: Approve, re-scope, or revoke a submitter
      description: |
        Atomically approves a pending viewer request, re-scopes an approved
        submitter, or revokes approved submitter access. Approval requires the
        single competition stored on the pending request. Scope replacement for
        an existing submitter requires at least one existing competition.
        Revocation requires an empty scope and removes every existing grant while
        retaining the request's historical `approved` decision state.

        A viewer in `not_requested` or `rejected` cannot be approved directly
        and must create a new request before an administrator can act.

        Rejecting a pending request is a separate operation at
        `POST /api/v1/admin/users/{userId}/submitter-access/rejection`.

        Administrator accounts, disabled accounts and the acting administrator's
        own account cannot be changed through this operation.
      operationId: updateAdministratorSubmitterAccess
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DatabaseIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorSubmitterAccessUpdate'
      responses:
        '200':
          description: Effective submitter access after the atomic update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSubmitterAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The target application account does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: The requested transition is invalid, or the target is the acting administrator, another administrator, or disabled. Invalid lifecycle transitions use `INVALID_SUBMITTER_ACCESS_TRANSITION`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The update shape or one of the requested competition scopes is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/admin/users/{userId}/submitter-access/rejection:
    post:
      tags:
        - Administration
      summary: Reject a pending submitter-access request
      description: |
        Rejects only a genuine pending viewer request. The atomic decision keeps
        the authoritative role as `viewer`, changes the request state to
        `rejected`, removes any submitter competition scopes, and records the
        acting administrator and decision time.

        This operation is distinct from revocation, which removes access from an
        existing approved submitter through the PATCH operation. A rejected viewer
        may create a new request and return to `pending`.
      operationId: rejectAdministratorSubmitterAccessRequest
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DatabaseIdentifier'
      responses:
        '200':
          description: Updated viewer account with a rejected request and no competition scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSubmitterAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The target application account does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: The target is not a pending viewer, is the acting administrator, is another administrator, or is disabled. Invalid lifecycle transitions use `INVALID_SUBMITTER_ACCESS_TRANSITION`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The target user identifier is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/competitions:
    get:
      tags:
        - Public Read
      summary: List competitions
      operationId: listCompetitions
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: name
          in: query
          description: Optional competition-name filter.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Paginated competitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/competitions/{competitionId}:
    get:
      tags:
        - Public Read
      summary: Get a competition
      operationId: getCompetition
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/CompetitionId'
      responses:
        '200':
          description: Competition detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/seasons:
    get:
      tags:
        - Public Read
      summary: List seasons
      operationId: listSeasons
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: competitionId
          in: query
          description: Limit results to one competition.
          schema:
            $ref: '#/components/schemas/ApiIdentifier'
      responses:
        '200':
          description: Paginated seasons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/seasons/{seasonId}:
    get:
      tags:
        - Public Read
      summary: Get a season
      operationId: getSeason
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: Season detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fixtures:
    get:
      tags:
        - Public Read
      summary: List fixtures
      operationId: listFixtures
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'

        - name: competitionId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: seasonId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: competitorId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: gender
          in: query
          schema:
            type: string
            minLength: 1

        - name: startDateFrom
          in: query
          description: Inclusive lower fixture-date bound.
          schema:
            type: string
            format: date

        - name: startDateTo
          in: query
          description: Inclusive upper fixture-date bound.
          schema:
            type: string
            format: date

      responses:
        '200':
          description: Paginated fixtures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/fixtures/{fixtureId}:
    get:
      tags:
        - Public Read
      summary: Get a fixture
      operationId: getFixture
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FixtureId'
      responses:
        '200':
          description: Fixture detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fixtures/{fixtureId}/events:
    get:
      tags:
        - Public Read
      summary: List accepted fixture events
      description: |
        Returns the current accepted revisions of cricket delivery events in
        deterministic innings and sequence order. Submission ownership,
        revision history and internal audit fields are not exposed.
      operationId: listFixtureEvents
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FixtureId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: inningsId
          in: query
          description: Limit events to one innings in the fixture.
          schema:
            $ref: '#/components/schemas/ApiIdentifier'
        - name: competitorId
          in: query
          description: Limit events to innings batted by this competitor.
          schema:
            $ref: '#/components/schemas/ApiIdentifier'
        - name: participantId
          in: query
          description: |
            Limit events to those involving this participant as striker,
            non-striker, bowler, dismissed player or identified fielder.
          schema:
            $ref: '#/components/schemas/ApiIdentifier'
        - name: overNumber
          in: query
          description: Limit events to one zero-based cricket over number.
          schema:
            type: integer
            minimum: 0
            maximum: 32767
        - name: wicketKind
          in: query
          description: Limit events to deliveries containing this dismissal kind.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Paginated accepted fixture events in occurrence order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fixtures/{fixtureId}/events/{eventId}:
    get:
      tags:
        - Public Read
      summary: Get an accepted fixture event
      operationId: getFixtureEvent
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FixtureId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: One current accepted fixture event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fixtures/{fixtureId}/statistics:
    get:
      tags:
        - Public Read
      summary: Get derived fixture statistics
      description: |
        Derives standard fixture, innings and participant statistics from the
        latest accepted revision of each ordered delivery event. Super-over
        innings are excluded from this Basic standard scope.
      operationId: getFixtureStatistics
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FixtureId'
        - $ref: '#/components/parameters/IncludeStatisticContributors'
      responses:
        '200':
          description: Derived fixture statistics and completeness state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureStatisticsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fixtures/{fixtureId}/statistics/{statisticId}:
    get:
      tags:
        - Public Read
      summary: Get one derived fixture statistic resource
      description: |
        Resolves a stable statistic identifier returned by the fixture
        statistics endpoint. Contributing accepted event records are opt-in.
      operationId: getFixtureStatistic
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FixtureId'
        - $ref: '#/components/parameters/StatisticId'
        - $ref: '#/components/parameters/IncludeStatisticContributors'
      responses:
        '200':
          description: One derived fixture statistic resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureStatisticResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/weather:
    get:
      tags:
        - Weather
      summary: Get weather for a location and date
      description: |
        Retrieves observed daily weather (temperature range, precipitation and
        maximum wind speed) for a given latitude, longitude and date from the
        Open-Meteo external API. Intended to provide contextual weather for a
        fixture; the caller currently supplies coordinates directly rather
        than a fixture identifier.
      operationId: getWeather
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/WeatherLatitude'
        - $ref: '#/components/parameters/WeatherLongitude'
        - $ref: '#/components/parameters/WeatherDate'
      responses:
        '200':
          description: Observed daily weather for the requested location and date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
              example:
                data:
                  date: '2026-08-19'
                  latitude: -26.2041
                  longitude: 28.0473
                  temperatureMax: 23.4
                  temperatureMin: 10.2
                  precipitationSum: 0
                  windSpeedMax: 18.5
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/competitors:
    get:
      tags:
        - Public Read
      summary: List competitors
      operationId: listCompetitors
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'

        - name: competitionId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: seasonId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: name
          in: query
          schema:
            type: string
            minLength: 1

      responses:
        '200':
          description: Paginated competitors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitorCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/competitors/{competitorId}:
    get:
      tags:
        - Public Read
      summary: Get a competitor
      operationId: getCompetitor
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/CompetitorId'
      responses:
        '200':
          description: Competitor detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/participants:
    get:
      tags:
        - Public Read
      summary: List participants
      operationId: listParticipants
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'

        - name: fixtureId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: competitorId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: name
          in: query
          schema:
            type: string
            minLength: 1

      responses:
        '200':
          description: Paginated participants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/participants/{participantId}:
    get:
      tags:
        - Public Read
      summary: Get a participant
      operationId: getParticipant
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '200':
          description: Participant detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/participants/{participantId}/fixtures:
    get:
      tags:
        - Public Read
      summary: List a participant's published fixture history and performance
      description: |
        Returns fixtures in which the participant was selected, newest first,
        with readable competition and team context plus the participant's
        available fixture-level batting and bowling figures. A selected player
        remains in the history when they did not bat or bowl. Partial accepted
        source data and fixtures without published delivery statistics are
        represented through statisticsStatus, statisticsWarnings and null
        batting or bowling values. Submission, account and audit data are not
        exposed.
      operationId: listParticipantFixtures
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated published fixture history for the participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantFixtureCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/submissions/events/{eventId}:
    put:
      tags:
        - Submissions
      summary: Correct an accepted fixture event
      description: Supersedes a live direct-submission delivery with a revalidated revision; derived statistics use the live revision.
      operationId: correctSubmissionEvent
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '200':
          description: The event was atomically superseded by a corrected revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The correction conflicts with a concurrently accepted delivery revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The correction failed contract, reference, or source-event validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/submissions:
    post:
      tags:
        - Submissions
      summary: Submit fixture event data
      description: |
        Accept an ordered set of cricket delivery events. The bearer identity
        must have the `submitter` or `admin` application role and the fixture's competition must
        be in that account's server-owned scope. Validation and storage are
        synchronous and atomic; clients submit events, never statistic totals.
      operationId: createSubmission
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
      responses:
        '201':
          description: Submission and all ordered events were accepted and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An event ID, innings sequence, or delivery position conflicts with accepted data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: The JSON payload exceeds 1 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Submission failed contract or domain validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: The submission-capable account exceeded 30 requests in 60 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the current rate-limit window ends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token

  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum records to return. Default 50; maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous collection response.
      schema:
        type: string
        minLength: 1

    CompetitionId:
      name: competitionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    FixtureId:
      name: fixtureId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    EventId:
      name: eventId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    WeatherLatitude:
      name: latitude
      in: query
      required: true
      description: Latitude in decimal degrees, between -90 and 90.
      schema:
        type: number
        minimum: -90
        maximum: 90

    WeatherLongitude:
      name: longitude
      in: query
      required: true
      description: Longitude in decimal degrees, between -180 and 180.
      schema:
        type: number
        minimum: -180
        maximum: 180

    WeatherDate:
      name: date
      in: query
      required: true
      description: Date in YYYY-MM-DD format.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'

    StatisticId:
      name: statisticId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    IncludeStatisticContributors:
      name: includeContributors
      in: query
      description: Include the ordered accepted delivery records that contributed to the result.
      schema:
        type: boolean
        default: false

    CompetitorId:
      name: competitorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    ParticipantId:
      name: participantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Unauthorized:
      description: A valid authentication token is required.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Forbidden:
      description: The authenticated account is not permitted to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    UpstreamError:
      description: The Open-Meteo external API returned an error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    UpstreamTimeout:
      description: The Open-Meteo external API did not respond within the configured timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    ServiceUnavailable:
      description: An unclassified failure occurred while contacting the external weather provider.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    ApiIdentifier:
      type: string
      minLength: 1
      description: |
        Stable opaque resource identifier. Consumers must not infer business
        meaning from its representation.

    DatabaseIdentifier:
      type: string
      pattern: '^[1-9]\d*$'
      maxLength: 19
      description: A positive database identifier represented as a JSON string.

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time

    CurrentUserProfileResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          type: object
          additionalProperties: false
          required:
            - id
            - subject
            - displayName
            - role
            - approvalState
            - requestedCompetition
            - competitionIds
          properties:
            id:
              $ref: '#/components/schemas/ApiIdentifier'
            subject:
              type: string
              minLength: 1
            displayName:
              oneOf:
                - type: string
                  minLength: 1
                - type: 'null'
            role:
              type: string
              enum:
                - viewer
                - submitter
                - admin
            approvalState:
              type: string
              deprecated: true
              description: Legacy submitter-request workflow state; not an authorization grant.
              enum:
                - not_requested
                - pending
                - approved
                - rejected
            requestedCompetition:
              oneOf:
                - $ref: '#/components/schemas/AdministratorCompetitionScope'
                - type: 'null'
              description: Competition stored on the submitter-access request, or null when none has been requested.
            competitionIds:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ApiIdentifier'

    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          const: DELETE

    AccountDeletionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
            - retainedCricketData
          properties:
            status:
              type: string
              const: deleted
            retainedCricketData:
              type: boolean
              const: true

    SubmitterAccessRequest:
      type: object
      additionalProperties: false
      required:
        - competitionId
      properties:
        competitionId:
          $ref: '#/components/schemas/DatabaseIdentifier'

    SubmitterAccessRequestResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - accountId
            - approvalState
            - requestedCompetition
          properties:
            accountId:
              $ref: '#/components/schemas/ApiIdentifier'
            approvalState:
              type: string
              enum:
                - pending
            requestedCompetition:
              $ref: '#/components/schemas/AdministratorCompetitionScope'

    AdministratorCompetitionScope:
      type: object
      additionalProperties: false
      required:
        - competitionId
        - name
      properties:
        competitionId:
          $ref: '#/components/schemas/ApiIdentifier'
        name:
          type: string
          minLength: 1

    AdministratorAuditActor:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
      properties:
        id:
          $ref: '#/components/schemas/ApiIdentifier'
        displayName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'

    AdministratorManagedUser:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - role
        - approvalState
        - requestedCompetition
        - competitionScopes
        - disabled
        - updatedAt
        - submitterAccessUpdatedAt
        - submitterAccessUpdatedBy
      properties:
        id:
          $ref: '#/components/schemas/ApiIdentifier'
        displayName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        role:
          type: string
          enum:
            - viewer
            - submitter
            - admin
        approvalState:
          type: string
          deprecated: true
          description: Compatibility state for the submitter-request workflow.
          enum:
            - not_requested
            - pending
            - approved
            - rejected
        requestedCompetition:
          oneOf:
            - $ref: '#/components/schemas/AdministratorCompetitionScope'
            - type: 'null'
          description: Competition stored on the submitter-access request, or null for legacy and not-requested accounts.
        competitionScopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdministratorCompetitionScope'
        disabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        submitterAccessUpdatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        submitterAccessUpdatedBy:
          oneOf:
            - $ref: '#/components/schemas/AdministratorAuditActor'
            - type: 'null'

    AdministratorUserManagementResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - users
            - availableScopes
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/AdministratorManagedUser'
            availableScopes:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/AdministratorCompetitionScope'

    AdministratorSubmitterAccessUpdate:
      type: object
      additionalProperties: false
      required:
        - approved
        - competitionIds
      properties:
        approved:
          type: boolean
          description: True grants the submitter role; false revokes it.
        competitionIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiIdentifier'
      description: |
        For a pending viewer approval, `competitionIds` must contain exactly the
        competition stored on the request. For an existing submitter scope
        replacement, it must contain at least one item. When false, the array
        must be empty.

    AdministratorSubmitterAccessResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AdministratorManagedUser'

    ApiErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
          minLength: 1
        field:
          type: string
          minLength: 1
        eventIndex:
          type: integer
          minimum: 0

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
            message:
              type: string
              minLength: 1
            details:
              type: array
              items:
                $ref: '#/components/schemas/ApiErrorDetail'

    WeatherData:
      type: object
      additionalProperties: false
      required:
        - date
        - latitude
        - longitude
        - temperatureMax
        - temperatureMin
        - precipitationSum
        - windSpeedMax
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        temperatureMax:
          oneOf:
            - type: number
            - type: 'null'
          description: Maximum daily temperature in degrees Celsius.
        temperatureMin:
          oneOf:
            - type: number
            - type: 'null'
          description: Minimum daily temperature in degrees Celsius.
        precipitationSum:
          oneOf:
            - type: number
            - type: 'null'
          description: Total daily precipitation in millimetres.
        windSpeedMax:
          oneOf:
            - type: number
            - type: 'null'
          description: Maximum daily wind speed in km/h.

    WeatherResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/WeatherData'

    PaginationMetadata:
      type: object
      additionalProperties: false
      required:
        - nextCursor
      properties:
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'

    Competition:
      type: object
      additionalProperties: false
      required:
        - competitionId
        - name
      properties:
        competitionId:
          $ref: '#/components/schemas/ApiIdentifier'
        name:
          type: string
          minLength: 1

    Season:
      type: object
      additionalProperties: false
      required:
        - seasonId
        - competitionId
        - competitionName
        - label
      properties:
        seasonId:
          $ref: '#/components/schemas/ApiIdentifier'
        competitionId:
          $ref: '#/components/schemas/ApiIdentifier'
        competitionName:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1

    Fixture:
      type: object
      additionalProperties: false
      required:
        - fixtureId
        - competitionId
        - competitionName
        - seasonId
        - season
        - seasonLabel
        - competitors
        - matchType
        - teamType
        - gender
        - ballsPerOver
        - scheduledOvers
        - startDate
        - endDate
      properties:
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'

        competitionId:
          oneOf:
            - $ref: '#/components/schemas/ApiIdentifier'
            - type: 'null'
        competitionName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'

        seasonId:
          oneOf:
            - $ref: '#/components/schemas/ApiIdentifier'
            - type: 'null'

        season:
          type: string
          minLength: 1
        seasonLabel:
          type: string
          minLength: 1

        competitors:
          type: array
          items:
            $ref: '#/components/schemas/Competitor'
        matchType:
          type: string
          minLength: 1

        teamType:
          type: string
          minLength: 1

        gender:
          type: string
          minLength: 1

        ballsPerOver:
          type: integer
          minimum: 1

        scheduledOvers:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'

        startDate:
          type: string
          format: date

        endDate:
          type: string
          format: date

    Competitor:
      type: object
      additionalProperties: false
      required:
        - competitorId
        - name
      properties:
        competitorId:
          $ref: '#/components/schemas/ApiIdentifier'
        name:
          type: string
          minLength: 1

    Participant:
      type: object
      additionalProperties: false
      required:
        - participantId
        - displayName
      properties:
        participantId:
          $ref: '#/components/schemas/ApiIdentifier'
        displayName:
          type: string
          minLength: 1

    ParticipantFixtureBatting:
      type: object
      additionalProperties: false
      required:
        - runsScored
        - ballsFaced
        - fours
        - sixes
        - strikeRate
      properties:
        runsScored:
          type: integer
          minimum: 0
        ballsFaced:
          type: integer
          minimum: 0
        fours:
          type: integer
          minimum: 0
        sixes:
          type: integer
          minimum: 0
        strikeRate:
          oneOf:
            - type: number
              minimum: 0
            - type: 'null'

    ParticipantFixtureBowling:
      type: object
      additionalProperties: false
      required:
        - runsConceded
        - legalBallsBowled
        - oversBowled
        - wicketsTaken
        - economyRate
      properties:
        runsConceded:
          type: integer
          minimum: 0
        legalBallsBowled:
          type: integer
          minimum: 0
        oversBowled:
          type: string
          pattern: '^\d+\.\d+$'
        wicketsTaken:
          type: integer
          minimum: 0
        economyRate:
          oneOf:
            - type: number
              minimum: 0
            - type: 'null'

    ParticipantFixture:
      type: object
      additionalProperties: false
      required:
        - fixture
        - competitionName
        - competitors
        - competitor
        - role
        - statisticsStatus
        - statisticsWarnings
        - batting
        - bowling
      properties:
        fixture:
          $ref: '#/components/schemas/Fixture'
        competitionName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        competitors:
          type: array
          items:
            $ref: '#/components/schemas/Competitor'
        competitor:
          $ref: '#/components/schemas/Competitor'
        role:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        statisticsStatus:
          type: string
          enum:
            - complete
            - partial
        statisticsWarnings:
          type: array
          items:
            $ref: '#/components/schemas/FixtureStatisticsWarning'
        batting:
          oneOf:
            - $ref: '#/components/schemas/ParticipantFixtureBatting'
            - type: 'null'
        bowling:
          oneOf:
            - $ref: '#/components/schemas/ParticipantFixtureBowling'
            - type: 'null'

    PublicEventFielder:
      type: object
      additionalProperties: false
      required:
        - participantId
        - isSubstitute
      properties:
        participantId:
          oneOf:
            - $ref: '#/components/schemas/ApiIdentifier'
            - type: 'null'
        isSubstitute:
          type: boolean

    PublicEventWicket:
      type: object
      additionalProperties: false
      required:
        - wicketId
        - kind
        - playerOutParticipantId
        - fielders
      properties:
        wicketId:
          $ref: '#/components/schemas/ApiIdentifier'
        kind:
          type: string
          minLength: 1
        playerOutParticipantId:
          $ref: '#/components/schemas/ApiIdentifier'
        fielders:
          type: array
          items:
            $ref: '#/components/schemas/PublicEventFielder'

    PublicEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - fixtureId
        - inningsId
        - inningsOrdinal
        - sequenceNumber
        - overNumber
        - positionInOver
        - ballNumber
        - battingCompetitorId
        - bowlingCompetitorId
        - strikerParticipantId
        - nonStrikerParticipantId
        - bowlerParticipantId
        - runs
        - extras
        - wickets
      properties:
        eventId:
          $ref: '#/components/schemas/ApiIdentifier'
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        inningsId:
          $ref: '#/components/schemas/ApiIdentifier'
        inningsOrdinal:
          type: integer
          minimum: 0
        sequenceNumber:
          type: integer
          minimum: 1
        overNumber:
          type: integer
          minimum: 0
        positionInOver:
          type: integer
          minimum: 0
        ballNumber:
          type: string
          minLength: 1
          description: Display label only; never used for ordering or identity.
        battingCompetitorId:
          $ref: '#/components/schemas/ApiIdentifier'
        bowlingCompetitorId:
          oneOf:
            - $ref: '#/components/schemas/ApiIdentifier'
            - type: 'null'
        strikerParticipantId:
          $ref: '#/components/schemas/ApiIdentifier'
        nonStrikerParticipantId:
          $ref: '#/components/schemas/ApiIdentifier'
        bowlerParticipantId:
          $ref: '#/components/schemas/ApiIdentifier'
        runs:
          type: object
          additionalProperties: false
          required:
            - offBat
            - extras
            - total
            - nonBoundary
          properties:
            offBat:
              type: integer
              minimum: 0
            extras:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            nonBoundary:
              type: boolean
        extras:
          type: object
          additionalProperties: false
          required:
            - wides
            - noBalls
            - byes
            - legByes
            - penalty
          properties:
            wides:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            noBalls:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            byes:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            legByes:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            penalty:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
        wickets:
          type: array
          items:
            $ref: '#/components/schemas/PublicEventWicket'

    StatisticContributingEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - fixtureId
        - inningsId
        - inningsOrdinal
        - sequenceNumber
        - strikerParticipantId
        - strikerParticipantName
        - bowlerParticipantId
        - bowlerParticipantName
        - runs
        - extras
        - nonBoundary
        - bowlerWickets
      properties:
        eventId:
          $ref: '#/components/schemas/ApiIdentifier'
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        inningsId:
          $ref: '#/components/schemas/ApiIdentifier'
        inningsOrdinal:
          type: integer
          minimum: 0
        sequenceNumber:
          type: integer
          minimum: 1
        strikerParticipantId:
          $ref: '#/components/schemas/ApiIdentifier'
        strikerParticipantName:
          type: string
          minLength: 1
        bowlerParticipantId:
          $ref: '#/components/schemas/ApiIdentifier'
        bowlerParticipantName:
          type: string
          minLength: 1
        runs:
          type: object
          additionalProperties: false
          required:
            - offBat
            - extras
            - total
          properties:
            offBat:
              type: integer
              minimum: 0
            extras:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        extras:
          type: object
          additionalProperties: false
          required:
            - wides
            - noBalls
            - byes
            - legByes
            - penalty
          properties:
            wides:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            noBalls:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            byes:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            legByes:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            penalty:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
        nonBoundary:
          type: boolean
        bowlerWickets:
          type: integer
          minimum: 0

    FixtureStatisticCommon:
      type: object
      required:
        - statisticId
        - fixtureId
        - sourceEventCount
      properties:
        statisticId:
          $ref: '#/components/schemas/ApiIdentifier'
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        sourceEventCount:
          type: integer
          minimum: 0
        contributingEvents:
          type: array
          description: Present only when includeContributors=true.
          items:
            $ref: '#/components/schemas/StatisticContributingEvent'

    InningsTeamStatistic:
      allOf:
        - $ref: '#/components/schemas/FixtureStatisticCommon'
        - type: object
          required:
            - scope
            - statisticCode
            - inningsId
            - inningsOrdinal
            - competitorId
            - competitorName
            - metrics
          properties:
            scope:
              type: string
              const: innings
            statisticCode:
              type: string
              const: team_total
            inningsId:
              $ref: '#/components/schemas/ApiIdentifier'
            inningsOrdinal:
              type: integer
              minimum: 0
            competitorId:
              $ref: '#/components/schemas/ApiIdentifier'
            competitorName:
              type: string
              minLength: 1
            metrics:
              type: object
              additionalProperties: false
              required:
                - deliveryRuns
                - penaltyRuns
                - totalRuns
              properties:
                deliveryRuns:
                  type: integer
                  minimum: 0
                penaltyRuns:
                  type: integer
                  minimum: 0
                totalRuns:
                  type: integer
                  minimum: 0

    ParticipantFixtureStatistic:
      allOf:
        - $ref: '#/components/schemas/FixtureStatisticCommon'
        - type: object
          required:
            - participantId
            - participantName
            - competitorId
            - competitorName
            - batting
            - bowling
          properties:
            scope:
              type: string
              const: participant
            statisticCode:
              type: string
              const: participant_fixture
            participantId:
              $ref: '#/components/schemas/ApiIdentifier'
            participantName:
              type: string
              minLength: 1
            competitorId:
              oneOf:
                - $ref: '#/components/schemas/ApiIdentifier'
                - type: 'null'
            competitorName:
              oneOf:
                - type: string
                  minLength: 1
                - type: 'null'

            batting:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - runsScored
                    - ballsFaced
                    - strikeRate
                    - fours
                    - sixes
                  properties:
                    runsScored:
                      type: integer
                      minimum: 0
                    ballsFaced:
                      type: integer
                      minimum: 0
                    strikeRate:
                      oneOf:
                        - type: number
                          minimum: 0
                        - type: 'null'
                    fours:
                      type: integer
                      minimum: 0
                    sixes:
                      type: integer
                      minimum: 0
                - type: 'null'
            bowling:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - runsConceded
                    - legalBallsBowled
                    - oversBowled
                    - economyRate
                    - wicketsTaken
                  properties:
                    runsConceded:
                      type: integer
                      minimum: 0
                    legalBallsBowled:
                      type: integer
                      minimum: 0
                    oversBowled:
                      type: string
                      pattern: '^\d+\.\d+$'
                    economyRate:
                      oneOf:
                        - type: number
                          minimum: 0
                        - type: 'null'
                    wicketsTaken:
                      type: integer
                      minimum: 0
                - type: 'null'

    FixtureStatistic:
      oneOf:
        - $ref: '#/components/schemas/InningsTeamStatistic'
        - $ref: '#/components/schemas/ParticipantFixtureStatistic'

    FixtureStatisticsWarning:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - SOURCE_DATA_INCOMPLETE
            - NO_STANDARD_INNINGS
            - NO_ACCEPTED_EVENTS
            - INNINGS_WITHOUT_ACCEPTED_EVENTS
            - PARTICIPANT_COMPETITOR_UNKNOWN
        message:
          type: string
          minLength: 1
        inningsId:
          $ref: '#/components/schemas/ApiIdentifier'
        participantId:
          $ref: '#/components/schemas/ApiIdentifier'
        fields:
          type: array
          items:
            type: string
            minLength: 1

    FixtureOutcome:
      type: object
      additionalProperties: false
      required:
        - kind
        - winnerCompetitorId
        - winnerCompetitorName
        - eliminatorCompetitorId
        - eliminatorCompetitorName
        - margin
        - method
        - decidedByBowlOut
      properties:
        kind:
          type: string
          enum:
            - won
            - tie
            - draw
            - no_result
        winnerCompetitorId:
          oneOf:
            - $ref: '#/components/schemas/ApiIdentifier'
            - type: 'null'
        winnerCompetitorName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        eliminatorCompetitorId:
          oneOf:
            - $ref: '#/components/schemas/ApiIdentifier'
            - type: 'null'
        eliminatorCompetitorName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        margin:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
                - value
              properties:
                type:
                  type: string
                  enum:
                    - runs
                    - wickets
                value:
                  type: integer
                  minimum: 0
            - type: 'null'
        method:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        decidedByBowlOut:
          type: boolean

    FixtureStatistics:
      type: object
      additionalProperties: false
      required:
        - fixtureId
        - status
        - scope
        - outcome
        - warnings
        - statistics
      properties:
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        status:
          type: string
          enum:
            - complete
            - partial
        scope:
          type: object
          additionalProperties: false
          required:
            - superOversIncluded
          properties:
            superOversIncluded:
              type: boolean
              const: false
        outcome:
          $ref: '#/components/schemas/FixtureOutcome'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/FixtureStatisticsWarning'
        statistics:
          type: array
          items:
            $ref: '#/components/schemas/FixtureStatistic'

    FixtureStatisticsResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/FixtureStatistics'

    FixtureStatisticResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/FixtureStatistic'

    CompetitionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Competition'

    CompetitionCollectionResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Competition'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    SeasonResponse:
      type: object
