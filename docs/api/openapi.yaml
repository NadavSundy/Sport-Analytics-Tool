        decidedAt: { type: string, format: date-time }
        reason:
          oneOf: [{ type: string, minLength: 1 }, { type: 'null' }]

    ProvenanceLifecycleEntry:
      type: object
      additionalProperties: false
      required: [fromState, toState, at, actorKind, actorIdentifier, reason]
      properties:
        fromState:
          oneOf: [{ type: string, minLength: 1 }, { type: 'null' }]
        toState: { type: string, minLength: 1 }
        at: { type: string, format: date-time }
        actorKind: { type: string, minLength: 1 }
        actorIdentifier: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }

    ProvenanceSubmission:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          reference,
          submissionId,
          batchReference,
          fixtureId,
          competitionId,
          submitter,
          status,
          receivedAt,
          updatedAt,
          eventCount,
          source,
        ]
      properties:
        kind: { type: string, enum: [direct, file, batch] }
        reference: { type: string, minLength: 1 }
        submissionId:
          oneOf: [{ $ref: '#/components/schemas/ApiIdentifier' }, { type: 'null' }]
        batchReference:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        fixtureId:
          oneOf: [{ $ref: '#/components/schemas/ApiIdentifier' }, { type: 'null' }]
        competitionId:
          oneOf: [{ $ref: '#/components/schemas/ApiIdentifier' }, { type: 'null' }]
        submitter: { $ref: '#/components/schemas/ProvenanceActor' }
        status: { type: string, minLength: 1 }
        receivedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eventCount: { type: integer, minimum: 0 }
        source: { $ref: '#/components/schemas/ProvenanceSourceMetadata' }

    ProvenanceSubmissionDetail:
      allOf:
        - $ref: '#/components/schemas/ProvenanceSubmission'
        - type: object
          required: [lifecycle, decisions]
          properties:
            lifecycle:
              type: array
              items: { $ref: '#/components/schemas/ProvenanceLifecycleEntry' }
            decisions:
              type: array
              items: { $ref: '#/components/schemas/ProvenanceDecision' }

    ProvenanceSubmissionListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProvenanceSubmission' }
        pagination: { $ref: '#/components/schemas/PaginationMetadata' }

    ProvenanceSubmissionDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProvenanceSubmissionDetail' }

    ProvenanceEventSource:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          reference,
          submissionId,
          batchReference,
          batchItemId,
          submissionEventOrdinal,
          submitter,
          checksum,
          decision,
        ]
      properties:
        kind: { type: string, enum: [direct, file, batch] }
        reference: { type: string, minLength: 1 }
        submissionId: { $ref: '#/components/schemas/ApiIdentifier' }
        batchReference:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        batchItemId:
          oneOf: [{ $ref: '#/components/schemas/ApiIdentifier' }, { type: 'null' }]
        submissionEventOrdinal:
          oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
        submitter: { $ref: '#/components/schemas/ProvenanceActor' }
        checksum:
          oneOf:
            - { type: string, pattern: '^[0-9a-f]{64}$' }
            - type: 'null'
        decision:
          oneOf:
            - $ref: '#/components/schemas/ProvenanceDecision'
            - type: 'null'

    ProvenanceCorrection:
      type: object
      additionalProperties: false
      required: [correctionId, requester, correctedAt, reason, review]
      properties:
        correctionId: { $ref: '#/components/schemas/ApiIdentifier' }
        requester: { $ref: '#/components/schemas/ProvenanceActor' }
        correctedAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
        review:
          oneOf:
            - $ref: '#/components/schemas/ProvenanceDecision'
            - type: 'null'

    EventProvenanceRevision:
      type: object
      additionalProperties: false
      required: [deliveryId, revision, recordedAt, supersededAt, current, source, correction]
      properties:
        deliveryId: { $ref: '#/components/schemas/ApiIdentifier' }
        revision: { type: integer, minimum: 1 }
        recordedAt: { type: string, format: date-time }
        supersededAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        current: { type: boolean }
        source: { $ref: '#/components/schemas/ProvenanceEventSource' }
        correction:
          oneOf:
            - $ref: '#/components/schemas/ProvenanceCorrection'
            - type: 'null'

    EventProvenance:
      type: object
      additionalProperties: false
      required: [eventId, sourceEventId, fixtureId, competitionId, currentDeliveryId, revisions]
      properties:
        eventId: { $ref: '#/components/schemas/ApiIdentifier' }
        sourceEventId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        fixtureId: { $ref: '#/components/schemas/ApiIdentifier' }
        competitionId:
          oneOf: [{ $ref: '#/components/schemas/ApiIdentifier' }, { type: 'null' }]
        currentDeliveryId: { $ref: '#/components/schemas/ApiIdentifier' }
        revisions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EventProvenanceRevision' }

    EventProvenanceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/EventProvenance' }

    StatisticProvenanceContributor:
      type: object
      additionalProperties: false
      required: [deliveryId, revision, sourceEventId, source]
      properties:
        deliveryId: { $ref: '#/components/schemas/ApiIdentifier' }
        revision: { type: integer, minimum: 1 }
        sourceEventId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        source: { $ref: '#/components/schemas/ProvenanceEventSource' }

    StatisticProvenance:
      type: object
      additionalProperties: false
      required: [statisticId, fixtureId, statisticCode, scope, sourceEventCount, contributors]
      properties:
        statisticId: { type: string, minLength: 1 }
        fixtureId: { $ref: '#/components/schemas/ApiIdentifier' }
        statisticCode: { type: string, minLength: 1 }
        scope: { type: string, minLength: 1 }
        sourceEventCount: { type: integer, minimum: 0 }
        contributors:
          type: array
          items: { $ref: '#/components/schemas/StatisticProvenanceContributor' }

    StatisticProvenanceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StatisticProvenance' }

    BatchListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/BatchStatus' } }
        pagination: { $ref: '#/components/schemas/PaginationMetadata' }

    BatchReportLocation:
      type: object
      additionalProperties: false
      required: [filePath, sheetName, rowNumber, jsonPath, ordinal]
      properties:
        filePath: { type: [string, 'null'] }
        sheetName: { type: [string, 'null'] }
        rowNumber: { type: [integer, 'null'], minimum: 1 }
        jsonPath: { type: [string, 'null'] }
        ordinal: { type: integer, minimum: 0 }

    BatchReportContext:
      type: object
      additionalProperties: false
      required:
        [
          eventReference,
          fixtureId,
          fixtureLabel,
          inningsId,
          overNumber,
          positionInOver,
          description,
        ]
      properties:
        eventReference: { type: [string, 'null'] }
        fixtureId:
          { oneOf: [{ $ref: '#/components/schemas/DatabaseIdentifier' }, { type: 'null' }] }
        fixtureLabel: { type: [string, 'null'], minLength: 1 }
        inningsId:
          { oneOf: [{ $ref: '#/components/schemas/DatabaseIdentifier' }, { type: 'null' }] }
        overNumber: { type: [integer, 'null'], minimum: 0 }
        positionInOver: { type: [integer, 'null'], minimum: 1 }
        description: { type: string, minLength: 1 }

    BatchReportError:
      type: object
      additionalProperties: false
      required: [ruleCode, message, location, context]
      properties:
        ruleCode: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
        location: { $ref: '#/components/schemas/BatchReportLocation' }
        context: { $ref: '#/components/schemas/BatchReportContext' }

    BatchReferenceCandidate:
      type: object
      additionalProperties: false
      required: [candidateReference, label]
      properties:
        candidateReference:
          { type: string, format: uuid, description: Opaque candidate token; never a database ID. }
        label: { type: string, minLength: 1 }

    BatchReferenceResolution:
      type: object
      additionalProperties: false
      required:
        [referencePath, entityType, state, submittedReference, reason, requiredAction, candidates]
      properties:
        referencePath: { type: string, minLength: 1 }
        entityType: { type: string, enum: [competition, team, fixture, innings, participant] }
        state: { type: string, enum: [ambiguous, unresolved, invalid] }
        submittedReference: {}
        reason: { type: [string, 'null'], minLength: 1 }
        requiredAction: { type: string, enum: [select_candidate, contact_reviewer] }
        candidates: { type: array, items: { $ref: '#/components/schemas/BatchReferenceCandidate' } }

    BatchPublishedConflict:
      type: object
      additionalProperties: false
      required: [existingDeliveryId, existingSourceEventId, correctionPermitted, differences]
      properties:
        existingDeliveryId: { $ref: '#/components/schemas/DatabaseIdentifier' }
        existingSourceEventId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        correctionPermitted: { type: boolean }
        differences:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [fieldPath, submittedValue, publishedValue]
            properties:
              fieldPath: { type: string, minLength: 1 }
              submittedValue: {}
              publishedValue: {}

    BatchReportItem:
      type: object
      additionalProperties: false
      required:
        [
          ordinal,
          outcome,
          location,
          context,
          stagedRecordId,
          acceptedRecordId,
          operation,
          correctionTarget,
          referenceResolutions,
          errors,
        ]
      properties:
        ordinal: { type: integer, minimum: 0 }
        outcome:
          { type: string, enum: [pending, accepted, rejected, unresolved, duplicate, conflicting] }
        location: { $ref: '#/components/schemas/BatchReportLocation' }
        context: { $ref: '#/components/schemas/BatchReportContext' }
        stagedRecordId:
          { oneOf: [{ $ref: '#/components/schemas/DatabaseIdentifier' }, { type: 'null' }] }
        acceptedRecordId:
          { oneOf: [{ $ref: '#/components/schemas/DatabaseIdentifier' }, { type: 'null' }] }
        operation: { type: string, enum: [upsert, correction] }
        correctionTarget:
          oneOf:
            - type: object
              additionalProperties: false
              required: [sourceEventId, resolvedDeliveryId]
              properties:
                sourceEventId:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Exact external delivery identity supplied in correctsEventId.
                resolvedDeliveryId:
                  oneOf:
                    - { $ref: '#/components/schemas/DatabaseIdentifier' }
                    - { type: 'null' }
            - { type: 'null' }
        publishedConflict:
          oneOf:
            - { $ref: '#/components/schemas/BatchPublishedConflict' }
            - { type: 'null' }
        referenceResolutions:
          { type: array, items: { $ref: '#/components/schemas/BatchReferenceResolution' } }
        errors: { type: array, items: { $ref: '#/components/schemas/BatchReportError' } }

    BatchReportRuleGroup:
      type: object
      additionalProperties: false
      required: [ruleCode, count]
      properties:
        ruleCode: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        count: { type: integer, minimum: 1 }

    BatchFixtureSummary:
      type: object
      additionalProperties: false
      required: [fixtureId, label, total, accepted, rejected, unresolved]
      properties:
        fixtureId:
          { oneOf: [{ $ref: '#/components/schemas/DatabaseIdentifier' }, { type: 'null' }] }
        label: { type: string, minLength: 1 }
        total: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        unresolved: { type: integer, minimum: 0 }

    BatchReviewSummary:
      type: object
      additionalProperties: false
      required: [validation, resolution, approvalBlocked, blockingReasons]
      properties:
        validation:
          type: object
          additionalProperties: false
          required: [accepted, rejected, blockingErrors, duplicate, conflicting]
          properties:
            accepted: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            blockingErrors:
              type: integer
              minimum: 0
              description: Active batch-level or otherwise publishable-item validation errors that prevent approval; ordinary rejected-item errors are excluded.
            duplicate: { type: integer, minimum: 0 }
            conflicting: { type: integer, minimum: 0 }
        resolution:
          type: object
          additionalProperties: false
          required: [resolved, ambiguous, unresolved, invalid, proposed]
          properties:
            resolved: { type: integer, minimum: 0 }
            ambiguous: { type: integer, minimum: 0 }
            unresolved: { type: integer, minimum: 0 }
            invalid: { type: integer, minimum: 0 }
            proposed: { type: integer, minimum: 0 }
        approvalBlocked: { type: boolean }
        blockingReasons: { type: array, items: { type: string, minLength: 1 } }

    BatchReport:
      type: object
      additionalProperties: false
      required:
        [
          batch,
          errorGroups,
          reviewSummary,
          fixtureSummaries,
          acceptedSamples,
          blockingItems,
          items,
          pagination,
          downloadUrl,
        ]
      properties:
        batch: { $ref: '#/components/schemas/BatchStatus' }
        errorGroups: { type: array, items: { $ref: '#/components/schemas/BatchReportRuleGroup' } }
        reviewSummary: { $ref: '#/components/schemas/BatchReviewSummary' }
        fixtureSummaries:
          { type: array, items: { $ref: '#/components/schemas/BatchFixtureSummary' } }
        acceptedSamples:
          { type: array, maxItems: 15, items: { $ref: '#/components/schemas/BatchReportItem' } }
        blockingItems:
          type: array
          description: Approval-blocking reference and conflict items selected independently of ordinary report pagination.
          items: { $ref: '#/components/schemas/BatchReportItem' }
        items: { type: array, items: { $ref: '#/components/schemas/BatchReportItem' } }
        pagination: { $ref: '#/components/schemas/PaginationMetadata' }
        downloadUrl: { type: string, pattern: '^/api/v1/batches/' }

    BatchReportResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/BatchReport' }

    BatchReportDownload:
      type: object
      additionalProperties: false
      required: [batch, errorGroups, reviewSummary, fixtureSummaries, acceptedSamples, items]
      properties:
        batch: { $ref: '#/components/schemas/BatchStatus' }
        errorGroups: { type: array, items: { $ref: '#/components/schemas/BatchReportRuleGroup' } }
        reviewSummary: { $ref: '#/components/schemas/BatchReviewSummary' }
        fixtureSummaries:
          { type: array, items: { $ref: '#/components/schemas/BatchFixtureSummary' } }
        acceptedSamples:
          { type: array, maxItems: 15, items: { $ref: '#/components/schemas/BatchReportItem' } }
        items: { type: array, items: { $ref: '#/components/schemas/BatchReportItem' } }

    BatchReportDownloadResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/BatchReportDownload' }

    BatchReferenceMappingRequest:
      type: object
      additionalProperties: false
      required: [itemOrdinal, referencePath, candidateReference, decisionKey]
      properties:
        itemOrdinal: { type: integer, minimum: 0 }
        referencePath: { type: string, minLength: 1, maxLength: 1000 }
        candidateReference: { type: string, format: uuid }
        decisionKey: { type: string, minLength: 1, maxLength: 255 }

    BatchReferenceMappingReceipt:
      type: object
      additionalProperties: false
      required: [batchReference, decisionReference, status, statusUrl, submittedAt]
      properties:
        batchReference: { type: string, format: uuid }
        decisionReference: { type: string, format: uuid }
        status: { type: string, enum: [queued, applied] }
        statusUrl: { type: string, pattern: '^/api/v1/batches/' }
        submittedAt: { type: string, format: date-time }

    BatchReferenceMappingResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/BatchReferenceMappingReceipt' }

    SubmissionFielder:
      type: object
      additionalProperties: false
      properties:
        participantId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        substitute:
          type: boolean
          default: false

    SubmissionWicket:
      type: object
      additionalProperties: false
      required:
        - kind
        - playerOutId
      properties:
        kind:
          type: string
          enum:
            - caught
            - bowled
            - lbw
            - stumped
            - caught and bowled
            - hit wicket
            - run out
            - obstructing the field
            - timed out
            - hit the ball twice
            - handled the ball
            - retired hurt
            - retired out
            - retired not out
        playerOutId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        fielders:
          type: array
          maxItems: 11
          default: []
          items:
            $ref: '#/components/schemas/SubmissionFielder'

    SubmissionEvent:
      type: object
      description: A single ordered cricket delivery event, not a statistic total.
      additionalProperties: false
      required:
        - eventId
        - inningsId
        - sequenceNumber
        - overNumber
        - positionInOver
        - ballNumber
        - strikerId
        - nonStrikerId
        - bowlerId
        - runs
      properties:
        eventId:
          type: string
          format: uuid
          description: Globally unique client-generated identifier used to detect retries.
        inningsId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        sequenceNumber:
          type: integer
          minimum: 1
          maximum: 2147483647
        overNumber:
          type: integer
          minimum: 0
          maximum: 32767
        positionInOver:
          type: integer
          minimum: 0
          maximum: 32767
          description: Zero-based position in the over; unlike the display ball number, this cannot repeat.
        ballNumber:
          type: string
          minLength: 1
          maxLength: 32
        strikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        nonStrikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        bowlerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        runs:
          type: object
          additionalProperties: false
          required:
            - offBat
            - extras
            - total
          properties:
            offBat:
              type: integer
              minimum: 0
              maximum: 32767
            extras:
              type: integer
              minimum: 0
              maximum: 32767
            total:
              type: integer
              minimum: 0
              maximum: 32767
            nonBoundary:
              type: boolean
              default: false
        extras:
          type: object
          additionalProperties: false
          default: {}
          properties:
            wides:
              type: integer
              minimum: 0
              maximum: 32767
            noBalls:
              type: integer
              minimum: 0
              maximum: 32767
            byes:
              type: integer
              minimum: 0
              maximum: 32767
            legByes:
              type: integer
              minimum: 0
              maximum: 32767
            penalty:
              type: integer
              minimum: 0
              maximum: 32767
        wickets:
          type: array
          maxItems: 2
          default: []
          items:
            $ref: '#/components/schemas/SubmissionWicket'

    SubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - fixtureId
        - schemaVersion
        - events
      properties:
        fixtureId:
          $ref: '#/components/schemas/DatabaseIdentifier'

        schemaVersion:
          type: string
          const: '1.0'

        events:
          type: array
          description: Events for each innings must appear in ascending sequenceNumber order.
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SubmissionEvent'

    Submission:
      type: object
      additionalProperties: false
      required:
        - submissionId
        - fixtureId
        - submitterId
        - status
        - receivedAt
        - schemaVersion
        - eventCount
      properties:
        submissionId:
          $ref: '#/components/schemas/ApiIdentifier'
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        submitterId:
          $ref: '#/components/schemas/ApiIdentifier'
        status:
          type: string
          const: accepted
        receivedAt:
          type: string
          format: date-time
        schemaVersion:
          type: string
          const: '1.0'
        eventCount:
          type: integer
          minimum: 1
        checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the validated direct payload or original uploaded file bytes.
        sourceFile:
          $ref: '#/components/schemas/SubmissionSourceFile'

    SubmissionSourceFile:
      type: object
      additionalProperties: false
      required:
        - fileName
        - mediaType
        - sizeBytes
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mediaType:
          type: string
          enum: [application/json, text/csv]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 1000000

    SubmissionUploadRequest:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: A .json application/json file or .csv text/csv file, at most 1 MB.

    SubmissionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Submission'

    CorrectionEvent:
      type: object
      description: Corrected delivery content. The source event ID and occurrence sequence are inherited from the target event.
      additionalProperties: false
      required:
        - inningsId
        - overNumber
        - positionInOver
        - ballNumber
        - strikerId
        - nonStrikerId
        - bowlerId
        - runs
      properties:
        inningsId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        overNumber:
          type: integer
          minimum: 0
          maximum: 32767
        positionInOver:
          type: integer
          minimum: 0
          maximum: 32767
        ballNumber:
          type: string
          pattern: '^\\d{1,3}\\.\\d{1,2}$'
        strikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        nonStrikerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        bowlerId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        runs:
          type: object
          additionalProperties: false
          required: [offBat, extras, total]
          properties:
            offBat: { type: integer, minimum: 0, maximum: 32767 }
            extras: { type: integer, minimum: 0, maximum: 32767 }
            total: { type: integer, minimum: 0, maximum: 32767 }
            nonBoundary: { type: boolean, default: false }
        extras:
          type: object
          additionalProperties: false
          default: {}
          properties:
            wides: { type: integer, minimum: 0, maximum: 32767 }
            noBalls: { type: integer, minimum: 0, maximum: 32767 }
            byes: { type: integer, minimum: 0, maximum: 32767 }
            legByes: { type: integer, minimum: 0, maximum: 32767 }
            penalty: { type: integer, minimum: 0, maximum: 32767 }
        wickets:
          type: array
          maxItems: 2
          default: []
          items:
            $ref: '#/components/schemas/SubmissionWicket'

    CorrectionRequest:
      type: object
      additionalProperties: false
      required: [fixtureId, schemaVersion, reason, event]
      properties:
        fixtureId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        schemaVersion:
          type: string
          const: '1.0'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        event:
          $ref: '#/components/schemas/CorrectionEvent'

    Correction:
      type: object
      additionalProperties: false
      required: [eventId, fixtureId, revision, refreshedScopes]
      properties:
        eventId:
          type: string
          format: uuid
        fixtureId:
          $ref: '#/components/schemas/ApiIdentifier'
        revision:
          type: integer
          minimum: 1
        refreshedScopes:
          type: array
          description: Exact derived-statistic scopes whose live inputs changed with this correction.
          items:
            type: object
            additionalProperties: false
            required: [scope, participantId, competitionId, season]
            properties:
              scope:
                type: string
                enum: [fixture, season, competition, career]
              participantId:
                oneOf:
                  - $ref: '#/components/schemas/ApiIdentifier'
                  - type: 'null'
              competitionId:
                oneOf:
                  - $ref: '#/components/schemas/ApiIdentifier'
                  - type: 'null'
              season:
                oneOf:
                  - type: string
                    minLength: 1
                  - type: 'null'

    CorrectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Correction'

    CorrectionHistoryEntry:
      type: object
      additionalProperties: false
      required:
        [
          correctionId,
          previousDeliveryId,
          replacementDeliveryId,
          previousRevision,
          resultingRevision,
          requester,
          correctedAt,
          reason,
          source,
          previousState,
          resultingState,
          review,
        ]
      properties:
        correctionId: { $ref: '#/components/schemas/ApiIdentifier' }
        previousDeliveryId: { $ref: '#/components/schemas/ApiIdentifier' }
        replacementDeliveryId: { $ref: '#/components/schemas/ApiIdentifier' }
        previousRevision: { type: integer, minimum: 1 }
        resultingRevision: { type: integer, minimum: 1 }
        requester:
          type: object
          additionalProperties: false
          required: [accountId, displayName]
          properties:
            accountId: { $ref: '#/components/schemas/ApiIdentifier' }
            displayName: { type: [string, 'null'] }
        correctedAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
        source:
          type: object
          additionalProperties: false
          required: [submissionId, submissionEventOrdinal, batchItemId]
          properties:
            submissionId: { $ref: '#/components/schemas/ApiIdentifier' }
            submissionEventOrdinal: { type: [integer, 'null'], minimum: 0 }
            batchItemId:
              oneOf:
                - { $ref: '#/components/schemas/ApiIdentifier' }
                - { type: 'null' }
        previousState: { $ref: '#/components/schemas/SubmissionEvent' }
        resultingState: { $ref: '#/components/schemas/SubmissionEvent' }
        review:
          oneOf:
            - type: object
              additionalProperties: false
              required: [reviewer, decision, reviewedAt, reason]
              properties:
                reviewer:
                  type: object
                  additionalProperties: false
                  required: [accountId, displayName]
                  properties:
                    accountId: { $ref: '#/components/schemas/ApiIdentifier' }
                    displayName: { type: [string, 'null'] }
                decision: { type: string, enum: [approved, rejected] }
                reviewedAt: { type: string, format: date-time }
                reason: { type: string, minLength: 1 }
            - { type: 'null' }

    CorrectionHistoryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [eventId, fixtureId, corrections]
          properties:
            eventId: { type: string, format: uuid }
            fixtureId: { $ref: '#/components/schemas/ApiIdentifier' }
            corrections:
              type: array
              items: { $ref: '#/components/schemas/CorrectionHistoryEntry' }
