          description: Global batch history across all submitters, optionally filtered by lifecycle state.
          content:
            application/json: { schema: { $ref: '#/components/schemas/BatchListResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/batches:
    get:
      tags: [Batches]
      summary: List batches visible to the authenticated submitter or reviewer
      operationId: listBatches
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, minLength: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    received,
                    stored,
                    validating,
                    rejected,
                    awaiting_review,
                    correction_requested,
                    publishing,
                    published,
                    partially_published,
                    failed,
                    superseded,
                  ],
              },
          }
      responses:
        '200':
          description: Submitters receive only their own batches; administrator reviewers receive their authorised repository scope.
          content:
            application/json: { schema: { $ref: '#/components/schemas/BatchListResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Batches]
      summary: Stream a whole-season package into durable private staging
      operationId: createBatchReceipt
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 255 },
          }
        - {
            name: X-Competition-Id,
            in: header,
            required: true,
            schema: { $ref: '#/components/schemas/DatabaseIdentifier' },
          }
        - {
            name: X-Batch-Package-Version,
            in: header,
            required: true,
            schema: { type: string, const: '1.0' },
          }
        - {
            name: X-File-Name,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 255 },
          }
        - name: X-Replaces-Batch-Reference
          in: header
          required: false
          description: Opaque reference of the correction-requested batch replaced by this upload.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: string, format: binary } }
          text/csv: { schema: { type: string, format: binary } }
          application/x-ndjson: { schema: { type: string, format: binary } }
      responses:
        '202':
          {
            description: Private source bytes were durably staged; no event is published.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/BatchReceiptResponse' } },
              },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            Active-batch concurrency limit reached; idempotency conflict; or invalid, unauthorised,
            stale, or competing replacement relationship.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } }
        '413':
          {
            description: Payload exceeds 50 MB.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } },
          }
        '422':
          {
            description: Unsupported format or invalid receipt metadata.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } },
          }
        '503':
          {
            description: Private object storage is unavailable.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } },
          }

  /api/v1/batches/{batchReference}:
    get:
      tags: [Batches]
      summary: Retrieve asynchronous batch validation status and progress
      operationId: getBatchStatus
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchReference, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: Current durable batch lifecycle state and validation progress.,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/BatchStatusResponse' } },
              },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/batches/{batchReference}/report:
    get:
      tags: [Batches]
      summary: Retrieve a paginated item-level batch result report
      operationId: getBatchReport
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchReference, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Summary, grouped rules, source traceability and all faults for this report page.
          content:
            application/json: { schema: { $ref: '#/components/schemas/BatchReportResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/batches/{batchReference}/report/download:
    get:
      tags: [Batches]
      summary: Download the complete machine-readable batch report
      operationId: downloadBatchReport
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchReference, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Complete JSON report returned as a downloadable attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/BatchReportDownloadResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/batches/{batchReference}/review:
    post:
      tags: [Batches]
      summary: Decide and, on approval, publish a validated staged batch
      description: Competition-scoped administrators may approve, reject, or return a batch for correction. Approval records the decision and moves the batch to the resumable publishing state before accepted events are published. Ordinary rejected items remain unpublished and do not block the accepted subset; batch-level or accepted-item validation errors, conflicts, unresolved, invalid, or ambiguous references prevent approval. Rejection and return do not alter public event data.
      operationId: reviewBatch
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchReference, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchReviewRequest' }
      responses:
        '200':
          description: Persisted decision and current publication lifecycle state.
          content:
            application/json: { schema: { $ref: '#/components/schemas/BatchStatusResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Approval is unsafe, another decision won the race, or publication is leased.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } }
        '422':
          description: The decision or required reason is invalid.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } }

  /api/v1/batches/{batchReference}/conflicts/resolve:
    post:
      tags: [Batches]
      summary: Resolve one published-delivery conflict
      description: An administrator explicitly keeps the existing published delivery or converts the staged delivery into an immutable correction target. The decision is audited and never silently overwrites published cricket data.
      operationId: resolveBatchPublishedConflict
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchReference, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchConflictResolutionRequest' }
      responses:
        '200':
          description: Conflict resolved and current batch lifecycle returned.
          content:
            application/json: { schema: { $ref: '#/components/schemas/BatchStatusResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The conflict is stale, ambiguous, already resolved, or cannot be corrected safely.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } }
        '422':
          description: The conflict resolution request is invalid.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } }

  /api/v1/batches/{batchReference}/reference-mappings:
    post:
      tags: [Batches]
      summary: Map an ambiguous staged reference to a labeled candidate
      description: The owning submitter or a competition-scoped administrator may select an opaque candidate returned by the batch report. The decision is retained and asynchronous validation restarts from the original private source; canonical database identifiers are never accepted from the client.
      operationId: mapBatchReference
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: batchReference, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchReferenceMappingRequest' }
      responses:
        '200':
          description: An identical previously applied decision was returned idempotently.
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/BatchReferenceMappingResponse' } }
        '202':
          description: The durable decision was accepted and asynchronous revalidation was queued.
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/BatchReferenceMappingResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The candidate is stale, unavailable, or conflicts with a prior decision.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } }
        '422':
          description: The mapping request is invalid.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } }

  /api/v1/submissions/events/{eventId}:
    put:
      tags:
        - Submissions
      summary: Correct an accepted fixture event
      description: Supersedes a live direct-submission delivery with a revalidated revision; derived statistics use the live revision. Submitters require the fixture competition scope, while administrators may correct any eligible fixture without a scope assignment.
      operationId: correctSubmissionEvent
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '200':
          description: The event was atomically superseded by a corrected revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The correction conflicts with a concurrently accepted delivery revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The correction failed contract, reference, or source-event validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/submissions/events/{eventId}/history:
    get:
      tags:
        - Submissions
      summary: Retrieve immutable correction history for an accepted event
      description: Returns ordered before/after revisions, requester and reason, source provenance, explicit predecessor/replacement links, and review provenance where review applies. Submitters require the fixture competition scope; administrators may inspect any eligible fixture.
      operationId: getSubmissionEventCorrectionHistory
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered immutable correction history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The event identifier is invalid or does not identify an accepted event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/submissions/uploads:
    post:
      tags:
        - Submissions
      summary: Upload fixture event data from a JSON or CSV file
      description: Accepts one JSON or CSV file no larger than 1 MB. The file is normalised into the same SubmissionRequest contract and follows the existing authorisation, validation, and atomic storage path. Submitters require the fixture competition scope, while administrators may upload for any eligible fixture without a scope assignment.
      operationId: createSubmissionUpload
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionUploadRequest'
      responses:
        '201':
          description: Uploaded events were accepted and source-file provenance was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An event ID, innings sequence, or delivery position conflicts with accepted data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: The uploaded file exceeds 1 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The file type, CSV structure, normalised submission, or domain references are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: The submission-capable account exceeded 30 requests in 60 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the current rate-limit window ends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/submissions:
    post:
      tags:
        - Submissions
      summary: Submit fixture event data
      description: |
        Accept an ordered set of cricket delivery events. The bearer identity
        must have the `submitter` or `admin` application role. An ordinary submitter requires the
        fixture competition in that account's server-owned scope; an administrator may submit for
        any eligible competition without a scope assignment. Validation and storage are synchronous
        and atomic; clients submit events, never statistic totals.
      operationId: createSubmission
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
      responses:
        '201':
          description: Submission and all ordered events were accepted and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An event ID, innings sequence, or delivery position conflicts with accepted data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: The JSON payload exceeds 1 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Submission failed contract or domain validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: The submission-capable account exceeded 30 requests in 60 seconds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the current rate-limit window ends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    DatasetReleaseVersion:
      name: version
      in: path
      required: true
      description: Stable caller-selected release identifier.
      schema:
        $ref: '#/components/schemas/DatasetReleaseVersion'

    Limit:
      name: limit
      in: query
      description: Maximum records to return. Default 50; maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous collection response.
      schema:
        type: string
        minLength: 1

    CompetitionId:
      name: competitionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    FixtureId:
      name: fixtureId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    EventId:
      name: eventId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    WeatherLatitude:
      name: latitude
      in: query
      required: true
      description: Latitude in decimal degrees, between -90 and 90.
      schema:
        type: number
        minimum: -90
        maximum: 90

    WeatherLongitude:
      name: longitude
      in: query
      required: true
      description: Longitude in decimal degrees, between -180 and 180.
      schema:
        type: number
        minimum: -180
        maximum: 180

    WeatherDate:
      name: date
      in: query
      required: true
      description: Date in YYYY-MM-DD format.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'

    StatisticId:
      name: statisticId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    IncludeStatisticContributors:
      name: includeContributors
      in: query
      description: Include the ordered accepted delivery records that contributed to the result.
      schema:
        type: boolean
        default: false

    CompetitorId:
      name: competitorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    ParticipantId:
      name: participantId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiIdentifier'

    ParticipantAggregateScope:
      name: scope
      in: query
      description: Restrict the response to one aggregate level. All three are returned by default.
      schema:
        type: string
        enum:
          - season
          - competition
          - career

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Unauthorized:
      description: A valid authentication token is required.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Forbidden:
      description: The authenticated account is not permitted to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    ExportTooLarge:
      description: >-
        The export would exceed the synchronous bound of 5,000 events. The whole export fails with
        EXPORT_TOO_LARGE so that a partial file is never returned; narrow it with a filter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    ExportTraceChanged:
      description: >-
        The accepted events changed between reading the calculation trace and reading its rows,
        so the export would not match the trace. It fails with EXPORT_TRACE_CHANGED; reload the
        trace and export again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    UnsupportedDate:
      description: >-
        The requested date is validly formatted but falls outside both the Open-Meteo forecast
        and archive endpoints' supported ranges.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    UpstreamError:
      description: The Open-Meteo external API returned an error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    UpstreamTimeout:
      description: The Open-Meteo external API did not respond within the configured timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    ServiceUnavailable:
      description: An unclassified failure occurred while contacting the external weather provider.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    ApiKeyUnauthorized:
      description: A missing, invalid or revoked API key was supplied.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: ApiKey }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }

    ConsumerLimitExceeded:
      description: The consumer rate limit or daily quota was exhausted.
      headers:
        RateLimit-Limit: { schema: { type: integer } }
        RateLimit-Remaining: { schema: { type: integer } }
        RateLimit-Reset: { schema: { type: integer } }
        X-Quota-Limit: { schema: { type: integer } }
        X-Quota-Remaining: { schema: { type: integer } }
        X-Quota-Reset: { schema: { type: integer } }
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  schemas:
    DatasetReleaseVersion:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'

    DatasetReleaseField:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }

    DatasetRelease:
      type: object
      additionalProperties: false
      required: [releaseId, version, createdAt, formatVersion, scope, eventCount, checksum, fields]
      properties:
        releaseId:
          $ref: '#/components/schemas/DatabaseIdentifier'
        version:
          $ref: '#/components/schemas/DatasetReleaseVersion'
        createdAt: { type: string, format: date-time }
        formatVersion: { type: string, const: '1.0' }
        scope: { type: string, const: published-accepted-deliveries }
        eventCount: { type: integer, minimum: 0 }
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 digest of the exact downloadable artefact bytes.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DatasetReleaseField'

    DatasetReleaseResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DatasetRelease'

    DatasetReleaseCollectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatasetRelease'

    DatasetReleaseJob:
      type: object
      additionalProperties: false
      required:
        [
          jobId,
          version,
          status,
          eventsProcessed,
          bytesWritten,
          pageNumber,
          createdAt,
          startedAt,
          completedAt,
          failureCode,
          failureMessage,
          release,
        ]
      properties:
        jobId: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/DatasetReleaseVersion' }
        status: { type: string, enum: [pending, generating, completed, failed] }
        eventsProcessed: { type: integer, minimum: 0 }
        bytesWritten: { type: integer, minimum: 0 }
        pageNumber: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        completedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        failureCode: { oneOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        failureMessage: { oneOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        release: { oneOf: [{ $ref: '#/components/schemas/DatasetRelease' }, { type: 'null' }] }

    DatasetReleaseJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DatasetReleaseJob' }

    DatasetReleaseArtifact:
      type: object
      additionalProperties: false
