  /api/v1/participants/{participantId}/statistics:
    get:
      tags:
        - Public Read
      summary: Get a participant's season, competition and career aggregates
      description: |
        Derives a participant's batting and bowling figures rolled up to three
        levels from the latest accepted revision of each delivery event: by
        competition and season, by competition alone, and across their whole
        career. Grouping is by participant identifier, never by display name.
        Super-over innings are excluded from every level, so a career figure
        equals the sum of the participant's published fixture figures. Rates are
        recomputed over each group rather than averaged across fixtures, and are
        null where their denominator is zero or where the fixtures in a group do
        not share one balls-per-over divisor. Bowling figures separately expose
        bowler-attributable wide and no-ball runs. Byes and leg-byes run off a
        wide are wide runs charged to the bowler (Law 22.6); other byes,
        leg-byes and innings penalty runs remain team extras.
      operationId: getParticipantAggregates
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
        - $ref: '#/components/parameters/ParticipantAggregateScope'
      responses:
        '200':
          description: Derived participant aggregates and completeness state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantAggregatesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

