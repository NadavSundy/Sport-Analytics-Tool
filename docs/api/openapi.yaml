openapi: 3.1.0

info:
  title: Sport Analytics API
  version: 1.0.0
  description: |
    Version-controlled contract for the handwritten Sport Analytics backend API.

    The supported API major version is `v1`; every documented path is served
    beneath `/api/v1`. URI paths are the only version-selection mechanism.
    Unsupported major-version paths return `404` with
    `UNSUPPORTED_API_VERSION`; request headers do not negotiate another API version.

    Operations marked with `x-implementation-status: planned` document agreed
    contracts that are not yet implemented. Implemented operations describe
    current backend behaviour.
x-ai-declaration: >-
  The preceding OpenAPI document was planned, generated, reviewed and edited
  with the assistance of ChatGPT-Web[GPT-5.6 Sol] and Codex[GPT-5].
x-api-versioning:
  versioning: uri-major
  supportedVersions: [v1]
  basePath: /api/v1
  responseHeader: API-Version
  unsupportedVersion:
    status: 404
    code: UNSUPPORTED_API_VERSION
servers:
  - url: https://statsthegame-api-dev-eecff5bbfjbyhbb2.southafricanorth-01.azurewebsites.net
    description: Development API

security: []

tags:
  - name: Health
    description: Service health and availability.

  - name: Authentication and Profile
    description: Managed-authentication identity and profile-related operations.

  - name: Public Read
    description: Anonymous sport-reference, fixture, accepted-event and statistic reads.

  - name: Dataset Releases
    description: Discoverable immutable published-data snapshots and artefact downloads.

  - name: Weather
    description: >-
      Contextual weather lookup for a location and date, backed by the
      Open-Meteo external API. See ADR-008 for the integration decision.

  - name: Submissions
    description: Approved-submitter event-submission operations.

  - name: Provenance
    description: Protected submission, event-revision and derived-statistic provenance.

  - name: Submitter Access
    description: Authenticated submitter-access request operations.

  - name: Administration
    description: Administrator-only application-account and submitter-scope operations.

  - name: Consumer API
    description: API-key authenticated external consumer reads with per-consumer protections.

paths:
  /api/v1/dataset-releases:
    get:
      tags: [Dataset Releases]
      summary: List available dataset releases
      operationId: listDatasetReleases
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Available immutable releases, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetReleaseCollectionResponse'

  /api/v1/dataset-releases/{version}:
    get:
      tags: [Dataset Releases]
      summary: Get dataset release metadata
      operationId: getDatasetRelease
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/DatasetReleaseVersion'
      responses:
        '200':
          description: Release scope, creation, schema and checksum metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetReleaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/dataset-releases/{version}/artifact.json:
    get:
      tags: [Dataset Releases]
      summary: Download a dataset release artefact
      operationId: downloadDatasetReleaseArtifact
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/DatasetReleaseVersion'
      responses:
        '200':
          description: The exact canonical JSON bytes covered by the release checksum.
          headers:
            Content-Disposition:
              description: Attachment filename for the immutable release.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetReleaseArtifact'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/dataset-releases:
    post:
      tags: [Administration, Dataset Releases]
      summary: Queue an immutable dataset release
      operationId: createDatasetRelease
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version:
                  $ref: '#/components/schemas/DatasetReleaseVersion'
      responses:
        '200':
          description: Existing immutable release metadata when the version is already published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetReleaseResponse'
        '202':
          description: Durable generation job accepted or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetReleaseJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/dataset-release-jobs/{jobId}:
    get:
      tags: [Administration, Dataset Releases]
      summary: Get dataset release generation status
      operationId: getDatasetReleaseJob
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Safe generation progress and completed release metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetReleaseJobResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/api-consumers:
    get:
      tags: [Administration]
      summary: List administrator-owned API consumers
      operationId: listApiConsumers
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Safe consumer and key metadata; raw keys are never returned.
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/ApiConsumerListResponse' } },
            }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      summary: Issue an external consumer API key
      description: The raw API key is returned exactly once in this response and is not stored by the service.
      operationId: issueApiConsumer
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApiConsumerIssue' } } }
      responses:
        '201':
          description: Consumer metadata and the one-time raw API key.
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/ApiConsumerIssueResponse' } },
            }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The issue request is invalid.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/ApiErrorResponse' } } }

  /api/v1/admin/api-consumers/{consumerId}/keys/rotate:
    post:
      tags: [Administration]
      summary: Rotate an API consumer key
      description: Revokes active keys before issuing the replacement. The raw replacement is returned once.
      operationId: rotateApiConsumerKey
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: consumerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/DatabaseIdentifier' }
      responses:
        '200':
          {
            description: Replacement key and safe metadata.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ApiConsumerRotateResponse' } },
              },
          }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/api-consumers/{consumerId}/keys/{keyId}:
    delete:
      tags: [Administration]
      summary: Revoke an API consumer key
      operationId: revokeApiConsumerKey
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: consumerId,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/DatabaseIdentifier' },
          }
        - {
            name: keyId,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/DatabaseIdentifier' },
          }
      responses:
        '204': { description: Key revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/consumer/competitions:
    get:
      tags: [Consumer API]
      summary: List competitions with a consumer API key
      operationId: listConsumerCompetitions
      x-implementation-status: implemented
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          {
            description: Competition page.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CompetitionCollectionResponse' } },
              },
          }
        '401': { $ref: '#/components/responses/ApiKeyUnauthorized' }
        '429': { $ref: '#/components/responses/ConsumerLimitExceeded' }

  /api/v1/consumer/fixtures:
    get:
      tags: [Consumer API]
      summary: List fixtures with a consumer API key
      operationId: listConsumerFixtures
      x-implementation-status: implemented
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          {
            description: Fixture page.,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/FixtureCollectionResponse' } },
              },
          }
        '401': { $ref: '#/components/responses/ApiKeyUnauthorized' }
        '429': { $ref: '#/components/responses/ConsumerLimitExceeded' }

  /api/v1/health:
    get:
      tags:
        - Health
      summary: Check API health
      operationId: getHealth
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: API is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: sport-analytics-api
                timestamp: '2026-08-09T14:00:00.000Z'

  /api/v1/auth/me:
    get:
      tags:
        - Authentication and Profile
      summary: Return the current application user profile
      description: |
        Verifies the bearer token through Supabase Auth, creates or synchronizes
        the provider-neutral application account, and returns server-owned role,
        submitter-approval and competition-scope state.

        Authentication never grants or changes approval, role or scope.
      operationId: getCurrentUserProfile
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current synchronized application user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/account:
    delete:
      tags:
        - Authentication and Profile
      summary: Permanently delete the authenticated account
      description: |
        Requires an exact `DELETE` confirmation and a Supabase sign-in no more
        than 15 minutes old. With server-only Supabase administration configured,
        the backend immediately disables the local account, removes its
        authorisation grants, hard-deletes its Supabase Auth user, and tombstones
        local identity fields.

        Cricket submissions, fixtures, deliveries, statistics and their stable
        provenance link remain available without the former display name or
        reusable authentication subject. If the server-only key is absent, the
        operation fails before changing local state.
      operationId: deleteCurrentAccount
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '200':
          description: Account identity deleted and local session may now be cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The identity was not authenticated recently enough.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The exact deletion confirmation was not supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '501':
          description: Server-only Supabase Auth administration is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: |
            Deletion could not be completed. The local account remains disabled
            and the operation can be retried safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/submitter-access-requests:
    post:
      tags:
        - Submitter Access
      summary: Request submitter access
      description: |
        Creates a competition-scoped submitter-access request for the
        authenticated application account by validating and storing the
        requested competition while transitioning an eligible server-owned
        approval state to `pending`.

        Accounts already in `pending` or `approved` state cannot create another
        active request. A previously rejected account may request access again.
      operationId: requestSubmitterAccess
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitterAccessRequest'
      responses:
        '201':
          description: Submitter access request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterAccessRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The account already has a pending request or is already approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The request body or requested competition is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/submitter-scope-requests:
    post:
      tags:
        - Submitter Access
      summary: Request an additional competition scope
      description: |
        Creates one pending additional competition-scope request for an already-approved
        submitter. The request does not modify the submitter's authoritative competition
        grants. Existing scopes remain effective until an administrator approves the request
        through the existing submitter-access management workflow.

        A submitter cannot request a competition they already hold and cannot create a second
        additional-scope request while one is awaiting administrator review.
      operationId: requestAdditionalSubmitterScope
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitterAccessRequest'
      responses:
        '201':
          description: Additional competition scope request created without granting access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitterScopeRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The account is not an approved submitter, the scope is already granted, or another scope request is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The request body or requested competition is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/admin/users:
    get:
      tags:
        - Administration
      summary: List registered users and competition scope choices
      description: |
        Returns every registered application account with its authoritative role,
        safe email address, compatibility approval state, requested competition, current named
        competition scopes, account state and latest submitter-access audit.
        Only an `admin` may call this operation.
      operationId: listAdministratorUsers
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registered users and valid competition scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorUserManagementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The server-only identity-provider email lookup is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/admin/users/{userId}/role:
    patch:
      tags:
        - Administration
      summary: Promote a user to administrator
      description: |
        Promotes an active non-administrator account to the authoritative `admin` role.
        Viewer and submitter transitions remain governed by the submitter-access lifecycle
        endpoints, so approval state and scoped grants cannot be bypassed. The acting
        administrator cannot change their own role and existing administrators cannot be
        demoted through this operation.
      operationId: updateAdministratorUserRole
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DatabaseIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorRoleUpdate'
      responses:
        '200':
          description: Updated administrator account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSubmitterAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The role transition is protected or must use the submitter-access lifecycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The user identifier or requested role is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: The server-only identity-provider email lookup is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/admin/users/{userId}/submitter-access:
    patch:
      tags:
        - Administration
      summary: Approve, re-scope, or revoke a submitter
      description: |
        Atomically approves a pending viewer request, re-scopes an approved
        submitter, or revokes approved submitter access. Approval requires the
        single competition stored on the pending request. Scope replacement for
        an existing submitter requires at least one existing competition. When an approved
        submitter has a pending additional-scope request, an approval must include the requested
        competition and the pending request is cleared only by the server-side decision.
        Revocation requires an empty scope and removes every existing grant while
        retaining the request's historical `approved` decision state.

        A viewer in `not_requested` or `rejected` cannot be approved directly
        and must create a new request before an administrator can act.

        Rejecting a pending request is a separate operation at
        `POST /api/v1/admin/users/{userId}/submitter-access/rejection`.

        Administrator accounts, disabled accounts and the acting administrator's
        own account cannot be changed through this operation.
      operationId: updateAdministratorSubmitterAccess
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DatabaseIdentifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorSubmitterAccessUpdate'
      responses:
        '200':
          description: Effective submitter access after the atomic update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSubmitterAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The target application account does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: The requested transition is invalid, or the target is the acting administrator, another administrator, or disabled. Invalid lifecycle transitions use `INVALID_SUBMITTER_ACCESS_TRANSITION`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The update shape or one of the requested competition scopes is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/admin/users/{userId}/submitter-access/rejection:
    post:
      tags:
        - Administration
      summary: Reject a pending submitter-access or additional-scope request
      description: |
        Rejects a genuine pending viewer request or an approved submitter's pending additional
        competition-scope request. Initial-request rejection keeps the authoritative role as
        `viewer` and changes the request state to `rejected`. Additional-scope rejection keeps
        the existing `submitter` role and every current competition grant unchanged. Both paths
        clear the pending requested competition and record the acting administrator and decision.

        This operation is distinct from revocation, which removes access from an existing
        approved submitter through the PATCH operation.
      operationId: rejectAdministratorSubmitterAccessRequest
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DatabaseIdentifier'
      responses:
        '200':
          description: Updated viewer account with a rejected request and no competition scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorSubmitterAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The target application account does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: The target is not a pending viewer, is the acting administrator, is another administrator, or is disabled. Invalid lifecycle transitions use `INVALID_SUBMITTER_ACCESS_TRANSITION`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The target user identifier is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/competitions:
    get:
      tags:
        - Public Read
      summary: List competitions
      operationId: listCompetitions
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: name
          in: query
          description: Optional competition-name filter.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Paginated competitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/competitions/{competitionId}:
    get:
      tags:
        - Public Read
      summary: Get a competition
      operationId: getCompetition
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/CompetitionId'
      responses:
        '200':
          description: Competition detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/seasons:
    get:
      tags:
        - Public Read
      summary: List seasons
      operationId: listSeasons
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: competitionId
          in: query
          description: Limit results to one competition.
          schema:
            $ref: '#/components/schemas/ApiIdentifier'
        - name: name
          in: query
          description: Match a season label or competition name.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Paginated seasons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/seasons/{seasonId}:
    get:
      tags:
        - Public Read
      summary: Get a season
      operationId: getSeason
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: Season detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/fixtures:
    get:
      tags:
        - Public Read
      summary: List fixtures
      operationId: listFixtures
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'

        - name: competitionId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: seasonId
          in: query
          schema:
            $ref: '#/components/schemas/ApiIdentifier'

        - name: competitorId
          in: query
          schema:
