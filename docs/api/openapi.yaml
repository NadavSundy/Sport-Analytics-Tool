            - type: string
              minLength: 1
            - type: 'null'
        role:
          type: string
          enum:
            - viewer
            - submitter
            - admin
        approvalState:
          type: string
          deprecated: true
          description: Compatibility state for the submitter-request workflow.
          enum:
            - not_requested
            - pending
            - approved
            - rejected
        requestedCompetition:
          oneOf:
            - $ref: '#/components/schemas/AdministratorCompetitionScope'
