  /api/v1/weather:
    get:
      tags:
        - Weather
      summary: Get weather for a location and date
      description: |
        Retrieves observed daily weather (temperature range, precipitation and
        maximum wind speed) for a given latitude, longitude and date from the
        Open-Meteo external API. Intended to provide contextual weather for a
        fixture; the caller currently supplies coordinates directly rather
        than a fixture identifier. The backend selects Open-Meteo's forecast
        or archive endpoint based on the requested date; dates outside both
        endpoints' supported ranges return `422 DATE_UNSUPPORTED`.
      operationId: getWeather
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/WeatherLatitude'
        - $ref: '#/components/parameters/WeatherLongitude'
        - $ref: '#/components/parameters/WeatherDate'
      responses:
        '200':
          description: Observed daily weather for the requested location and date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
              example:
                data:
                  date: '2026-08-19'
                  latitude: -26.2041
                  longitude: 28.0473
                  temperatureMax: 23.4
                  temperatureMin: 10.2
                  precipitationSum: 0
                  windSpeedMax: 18.5
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnsupportedDate'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/fixtures/{fixtureId}/weather:
    get:
      tags:
        - Weather
      summary: Get contextual weather for a fixture
      description: |
        Resolves the fixture's start date and venue coordinates, reusing stored
        coordinates or resolving the canonical venue and city first and raw venue
        name second when coordinates are absent. Resolved coordinates are persisted before daily
        weather is retrieved through the server-side
        Open-Meteo integration; a changed venue name or city invalidates them.
        Weather is contextual external information and is not authoritative
        fixture, event, or statistic data. If the fixture exists but cannot be
        located after those lookups, or its date falls outside Open-Meteo's
        supported forecast and archive ranges, a successful unavailable
        response is returned and Open-Meteo is not called.
      operationId: getFixtureWeather
      x-implementation-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FixtureId'
      responses:
        '200':
          description: Contextual fixture weather, or an explicit unavailable state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureWeatherResponse'
              examples:
                available:
                  value:
                    data:
                      fixtureId: '17'
                      date: '2026-08-19'
                      availability: available
                      venue:
                        name: Wits Cricket Oval
                        city: Johannesburg
                      weather:
                        date: '2026-08-19'
                        latitude: -26.1929
                        longitude: 28.0305
                        temperatureMax: 24
                        temperatureMin: 11
                        precipitationSum: 0
                        windSpeedMax: 17
                unavailable:
                  value:
                    data:
                      fixtureId: '17'
                      date: '2026-08-19'
                      availability: unavailable
                      reason: LOCATION_NOT_FOUND
                      venue:
                        name: Wits Cricket Oval
                        city: Johannesburg
                      weather: null
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

