site_name: Sport Analytics Tool
site_description: Public documentation for the COMS3011A Sport Analytics Tool
repo_name: Git Push Pray / Sport Analytics Tool
repo_url: https://sdp.ms.wits.ac.za/git-push-pray/Sport-Analytics-Tool

exclude_docs: |
  /README.md

theme:
  name: material
  logo: design/assets/logo/statsthegame-mark-light.svg
  favicon: design/assets/logo/statsthegame-favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to Night Match
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to Day Match
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

nav:
  - Home: index.md

  - Getting Started:
      - Overview: getting-started.md
      - Local Setup: development/setup.md
      - Technology Stack: development/technology-stack.md
      - Environment Variables: environment.md
      - Repository Structure: architecture/repository-structure.md

  - Product & API:
      - Overview: product-and-api.md
      - API Overview: api/overview.md
      - OpenAPI & API Explorer: api/openapi.md
      - Public Read API: api/public-read.md
      - Event Submissions: api/submissions.md
      - Batch Ingestion & Review: api/batches.md
      - Fixture Statistics: statistics/fixture-statistics.md
      - Participant Aggregates: statistics/participant-aggregates.md
      - Dataset Exports & Releases: data/dataset-exports.md
      - Consumer API Access: api/consumer-keys.md
      - Analytics Query: api/analytics-query.md
      - Weather Integration: api/weather.md

  - Architecture, Data & Security:
      - Overview: architecture-and-data.md
      - Architecture Overview: architecture/overview.md
      - Database Architecture Guide: database/guide.md
      - Final Database Audit: database/final-audit.md
      - Security Overview: security/overview.md
      - Authentication & Authorisation: security/authentication.md
      - Roles & Permissions: security/roles-and-permissions.md

  - Testing & Quality:
      - Overview: testing/index.md
      - Automated Testing Strategy: development/testing.md
      - Repository-wide Code Coverage: testing/code-coverage.md
      - Representative-scale Performance: development/performance-baseline.md
      - User Testing:
          - User Testing Overview: testing/user-testing-overview.md
          - Sprint 2 User Testing Summary: testing/user-testing-sprint-2-summary.md
          - Sprint 3 User Testing Summary: testing/user-testing-sprint-3-summary.md
      - Bug Tracking: testing/bug-tracking.md

  - Deployment & CI/CD:
      - Deployment Overview: deployment/overview.md
      - CI/CD & Quality Gates: development/ci-cd.md
      - Production-scale Acceptance: deployment/production-scale-acceptance.md
      - Frontend Hosting: deployment/frontend-cloudflare-pages.md
      - Backend Hosting: deployment/azure-backend.md
      - Worker Hosting: deployment/azure-worker.md

  - Methodology:
      - Overview: process/methodology-overview.md
      - Project Methodology: project_methodology.md
      - Git Methodology: git-methodology.md
      - Methodology in Practice: process/sprint-evidence.md

  - Project Records & Evidence:
      - Overview: process/index.md
      - Decisions Index: process/decisions.md
      - Team Meeting Transcripts: process/team-meeting-transcripts.md
      - Testing & Validation Evidence: process/validation-and-user-testing.md
      - AI Process & Policy: ai/usage.md
      - AI Use & Evidence: process/ai-use-evidence.md
      - Reference & Historical Records: process/reference-and-history.md

  - Final Submission:
      - Final Submission Reference: final-submission.md
      - Requirements & Rubric Traceability: planning/final-requirements-rubric-traceability.md
      - Final System Verification Bank: testing/final-system-verification.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
