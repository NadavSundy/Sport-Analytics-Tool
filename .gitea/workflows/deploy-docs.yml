name: Sport Analytics - Deploy Docs

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCS_URL: https://sports-analytics-tool.pages.dev
      CLOUDFLARE_PROJECT_NAME: sports-analytics-tool

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Required Gitea secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Required Gitea secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root workspace dependencies
        run: npm ci

      - name: Retrieve latest user-testing feedback
        env:
          USER_TESTING_FEEDBACK_ONEDRIVE_DRIVE_ID: ${{ secrets.USER_TESTING_FEEDBACK_ONEDRIVE_DRIVE_ID }}
          USER_TESTING_FEEDBACK_ONEDRIVE_FOLDER_ID: ${{ secrets.USER_TESTING_FEEDBACK_ONEDRIVE_FOLDER_ID }}
          USER_TESTING_FEEDBACK_ONEDRIVE_ACCESS_TOKEN: ${{ secrets.USER_TESTING_FEEDBACK_ONEDRIVE_ACCESS_TOKEN }}
        run: node scripts/retrieve-user-testing-feedback.mjs .user-testing-feedback

      - name: Validate retrieved user-testing feedback
        run: node scripts/user-feedback-ingestion.mjs .user-testing-feedback

      - name: Generate user-testing evidence pages
        run: npm run generate:user-testing-evidence -- .user-testing-feedback

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

      - name: Deploy documentation to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy site --project-name=$CLOUDFLARE_PROJECT_NAME

      - name: Smoke check deployed documentation site
        env:
          SMOKE_CHECK_ATTEMPTS: 12
          SMOKE_CHECK_DELAY_MS: 10000
          SMOKE_CHECK_TIMEOUT_MS: 15000
        run: >-
          node scripts/smoke-check-deployment.mjs
          "deployed documentation site"
          "$DOCS_URL/"
          "Sport Analytics Tool"
