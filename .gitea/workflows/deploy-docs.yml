name: Sport Analytics - Deploy Docs

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCS_URL: https://sports-analytics-tool.pages.dev
      CLOUDFLARE_PROJECT_NAME: sports-analytics-tool

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Required Gitea secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Required Gitea secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root workspace dependencies
        run: npm ci

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone for user-testing feedback
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG" ]; then
            echo "::error::Required Gitea secret RCLONE_CONFIG is not configured."
            exit 1
          fi
          install -d -m 700 "$HOME/.config/rclone"
          umask 077
          printf '%s' "$RCLONE_CONFIG" > "$HOME/.config/rclone/rclone.conf"

      - name: Retrieve user-testing feedback
        env:
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}
          RCLONE_SOURCE: ${{ secrets.RCLONE_SOURCE }}
        run: npm run retrieve:user-testing-feedback

      - name: Generate user-testing evidence pages
        run: npm run generate:user-testing-evidence -- testing/user-feedback/input

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

      - name: Deploy documentation to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy site --project-name=$CLOUDFLARE_PROJECT_NAME

      - name: Smoke check deployed documentation site
        env:
          SMOKE_CHECK_ATTEMPTS: 12
          SMOKE_CHECK_DELAY_MS: 10000
          SMOKE_CHECK_TIMEOUT_MS: 15000
        run: >-
          node scripts/smoke-check-deployment.mjs
          "deployed documentation site"
          "$DOCS_URL/"
          "Sport Analytics Tool"
