name: User feedback closure guard

'on':
  issues:
    types: [closed]

# This workflow must be able to reopen issues and add an explanatory comment.
permissions:
  contents: read
  issues: write

jobs:
  enforce-user-feedback-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify closure guard tests
        run: node --test scripts/ci/enforce-user-feedback-closure-gate.test.mjs

      - name: Enforce required user-feedback gate
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPOSITORY: ${{ gitea.event.repository.full_name }}
          GITEA_EVENT_PATH: ${{ gitea.event_path }}
        run: node scripts/ci/enforce-user-feedback-closure-gate.mjs "$GITEA_EVENT_PATH"
