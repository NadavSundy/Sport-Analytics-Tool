name: Intermediate Ingestion Acceptance

on:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NODE_ENV: test
      KNIP_DISABLE_RAW_TRANSFER: '1'
      SUPABASE_URL: https://example.invalid
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      PLAYWRIGHT_REUSE_BUILD: '1'
      PLAYWRIGHT_WORKERS: '2'
      VITE_SUPABASE_URL: https://e2e.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: e2e-public-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts for browser acceptance
        run: npm run build --workspace=@sport-analytics/contracts

      - name: Build frontend production bundle once
        env:
          NODE_ENV: production
        run: npm run build --workspace=@sport-analytics/frontend

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu24-chromium-1.62.1

      - name: Ensure Playwright Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Verify complete Intermediate ingestion pipeline
        run: npm run verify:intermediate-ingestion
