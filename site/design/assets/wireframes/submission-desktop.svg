<svg viewBox="0 0 1280 940" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="940" fill="#FFFFFF" stroke="#3A4650" stroke-width="2"/>
<rect x="0" y="0" width="1280" height="64" rx="4" fill="#101E2B" stroke="#101E2B" stroke-width="1.5"/>
<text x="24" y="40" font-size="18" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">Stat'sTheGame</text>
<text x="1000" y="40" font-size="11" font-weight="normal" font-style="normal" fill="#FFFFFF" text-anchor="start">Signed in · Submitter</text>
<rect x="1120" y="16" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#9AA5AA" stroke-width="1.5"/>
<text x="1185.0" y="36.0" font-size="12" font-weight="bold" font-style="normal" fill="#102026" text-anchor="middle">Account</text>
<text x="24" y="100" font-size="22" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Submit Delivery Events</text>
<text x="24" y="122" font-size="11" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">Only fixtures in your server-returned competition scope appear below.</text>
<text x="24" y="158" font-size="12" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Fixture</text>
<rect x="24" y="168" width="500" height="32" rx="4" fill="#F2F1EC" stroke="#9AA5AA" stroke-width="1.2"/>
<text x="32" y="187.85" font-size="11" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">Competition A · Team X vs Team Y · 12 Aug 2026 ▾</text>
<text x="24" y="224" font-size="12" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Delivery events JSON</text>
<text x="24" y="242" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">Paste the events array for Basic schema 1.0. Fixture and schema version are added
automatically. Final totals are derived by the platform, not accepted here.</text>
<rect x="24" y="268" width="820" height="320" rx="4" fill="#F2F1EC" stroke="#9AA5AA" stroke-width="1.5"/>
<text x="36" y="288" font-size="11" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">{ "events": [ ... ] }</text>
<rect x="24" y="604" width="180" height="40" rx="6" fill="#5D7E00" stroke="#5D7E00" stroke-width="1.5"/>
<text x="114.0" y="628.0" font-size="12" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle">Submit events</text>
<rect x="872" y="158" width="384" height="430" rx="4" fill="#F2F1EC" stroke="#9AA5AA" stroke-width="1.5"/>
<text x="896" y="184" font-size="13" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">Before you submit</text>
<text x="896" y="214" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">• Only accepted event types are stored.</text>
<text x="896" y="234" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">• Rejected submissions list every field</text>
<text x="896" y="254" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">  and reason under the form.</text>
<text x="896" y="274" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">• Corrections supersede prior events;</text>
<text x="896" y="294" font-size="10" font-weight="normal" font-style="normal" fill="#627078" text-anchor="start">  they do not overwrite silently.</text>
<text x="24" y="656" font-size="13" font-weight="bold" font-style="normal" fill="#102026" text-anchor="start">States</text>
<rect x="24" y="664" width="390" height="70" rx="4" fill="#F2F1EC" stroke="#627078" stroke-width="1.5"/>
<text x="36" y="695.0" font-size="11" font-weight="bold" font-style="normal" fill="#627078" text-anchor="start">No in-scope fixtures: “Your account has submission</text>
<text x="36" y="711.0" font-size="11" font-weight="bold" font-style="normal" fill="#627078" text-anchor="start">access, but has no available fixtures in scope.”</text>
<rect x="438" y="664" width="390" height="70" rx="4" fill="#FBE3E5" stroke="#D64251" stroke-width="1.5"/>
<text x="450" y="695.0" font-size="11" font-weight="bold" font-style="normal" fill="#D64251" text-anchor="start">Validation rejected: per-field location + reason list</text>
<text x="450" y="711.0" font-size="11" font-weight="bold" font-style="normal" fill="#D64251" text-anchor="start">under the form, focus moves to the result heading</text>
<rect x="852" y="664" width="404" height="70" rx="4" fill="#F2F1EC" stroke="#627078" stroke-width="1.5"/>
<text x="864" y="695.0" font-size="11" font-weight="bold" font-style="normal" fill="#627078" text-anchor="start">Submitting… (button disabled) then “Events accepted”</text>
<text x="864" y="711.0" font-size="11" font-weight="bold" font-style="normal" fill="#627078" text-anchor="start">success panel</text>
